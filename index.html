vực giáo dục, không tác động đến lực lượng sản xuất", "Là nhân tố đã hoàn thiện, không còn cần đầu tư phát triển thêm"]}, {"n": 148, "p": 3, "q": "Điền vào chỗ trống \"...\" quan điểm: Xây dựng quan hệ sản xuất mới \"...\" với yêu cầu phát triển trình độ lực lượng sản xuất mới:", "a": "\"phù hợp\"", "note": "Quy luật QHSX phải phù hợp với LLSX.", "d": ["\"độc lập\"", "\"đi trước\"", "\"tách rời\""]}, {"n": 149, "p": 3, "q": "Những nhiệm vụ kinh tế cơ bản của thời kỳ quá độ lên CNXH ở Việt Nam:", "a": "Xây dựng cơ sở vật chất - kỹ thuật của CNXH, thực hiện công nghiệp hóa - hiện đại hóa, phát triển kinh tế nhiều thành phần, mở rộng quan hệ kinh tế đối ngoại", "note": "Các nhiệm vụ kinh tế thời kỳ quá độ.", "d": ["Xây dựng chủ nghĩa tư bản nhà nước, xóa bỏ kinh tế nhiều thành phần, đóng cửa với kinh tế đối ngoại", "Hoàn thành tập thể hóa toàn bộ nền kinh tế và loại bỏ kinh tế thị trường", "Phát triển nông nghiệp tự cung tự cấp, hạn chế công nghiệp hóa và kinh tế đối ngoại"]}, {"n": 150, "p": 3, "q": "Nghị quyết số 57-NQ/TW của Bộ Chính trị ban hành ngày 22/12/2024 đề cập đến nội dung nào sau đây?", "a": "Đột phá phát triển khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số quốc gia", "note": "Văn bản mới mang tính chiến lược về KHCN.", "d": ["Phát triển kinh tế tư nhân thành một động lực quan trọng của nền kinh tế", "Hội nhập quốc tế sâu rộng và hiệu quả trong tình hình mới", "Xây dựng và hoàn thiện thể chế, pháp luật về văn hóa và con người Việt Nam"]}];
const PARTS=["PHẦN 1: HÀNG HÓA, THỊ TRƯỜNG VÀ CÁC QUY LUẬT KINH TẾ", "PHẦN 2: TƯ BẢN, GIÁ TRỊ THẶNG DƯ VÀ CÁC QUY LUẬT CỦA CNTB", "PHẦN 3: TƯ BẢN CHO VAY, ĐỊA TÔ VÀ CHỦ NGHĨA TƯ BẢN ĐỘC QUYỀN", "PHẦN 4: THỜI KỲ QUÁ ĐỘ LÊN CHỦ NGHĨA XÃ HỘI VÀ THỰC TIỄN VIỆT NAM"];
let S={learned:{},wrong:{},fav:{}};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('ktct_s')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('ktct_s',JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id),L='ABCD';
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const mk=q=>{const o=sh([{t:q.a,c:1},...q.d.map(t=>({t,c:0}))]);return {q,o}};
let tab='study',st={part:'all',list:[],i:0,pick:null,mk:null},hist='wrong',ex=null,timer=null;
function nav(){$('nav').innerHTML=[['study','Ôn tập'],['exam','Thi thử'],['hist','Lịch sử'],['cf','☕ Mời cà phê']].map(([k,v])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')">${v}</button>`).join('')}
function go(t){tab=t;if(t=='study')buildList();render()}
function buildList(keep){st.list=Q.filter(q=>!S.learned[q.n]&&(st.part=='all'||q.p==st.part));if(!keep)st.i=0;if(st.i>=st.list.length)st.i=0;st.pick=null;st.mk=st.list.length?mk(st.list[st.i]):null}
function render(){nav();clearIntervalIf();({study:rStudy,exam:rExam,hist:rHist,cf:rCf})[tab]()}
function clearIntervalIf(){if(tab!='exam'&&timer){/* giữ timer chạy nền */}}
function rStudy(){
 const sel=`<select onchange="st.part=this.value;buildList();render()"><option value="all">Tất cả phần</option>${PARTS.map((p,i)=>`<option value="${i}" ${st.part==i?'selected':''}>${p}</option>`).join('')}</select>`;
 if(!st.list.length){$('app').innerHTML=`<div class="c">${sel}<p>🎉 Không còn câu nào cần ôn (đã thuộc hết hoặc phần này trống).</p></div>`;return}
 const m=st.mk,q=m.q,d=st.pick!==null;
 $('app').innerHTML=`<div class="c"><div class="row">${sel}<span class="sp"></span><span class="mu">Câu ${st.i+1}/${st.list.length} · Gốc #${q.n}</span></div>
 <div class="q">${q.q}</div>
 ${m.o.map((o,k)=>`<button class="o ${d?(o.c?'ok':(k==st.pick?'no':'')):''}" ${d?'disabled':''} onclick="ans(${k})"><i>${L[k]}</i><span>${o.t}</span></button>`).join('')}
 ${d?`<p class="${m.o[st.pick].c?'good':'warn'}">${m.o[st.pick].c?'✅ Chính xác!':'❌ Sai rồi! Đáp án đúng là '+L[m.o.findIndex(o=>o.c)]+'.'}</p>${q.note?`<p class="mu">💡 ${q.note}</p>`:''}`:''}
 <div class="row"><button class="b" onclick="mv(-1)">← Trước</button><button class="b" onclick="mv(1)">Sau →</button><span class="sp"></span>
 <button class="b" onclick="fav(${q.n})">${S.fav[q.n]?'⭐ Đã yêu thích':'☆ Yêu thích'}</button><button class="b p" onclick="learn(${q.n})">✔ Đã thuộc</button></div></div>`}
function ans(k){st.pick=k;const m=st.mk;if(!m.o[k].c){const w=S.wrong[m.q.n]||{c:0};w.c++;w.t=Date.now();S.wrong[m.q.n]=w;save()}rStudy()}
function mv(x){const n=st.list.length;st.i=(st.i+x+n)%n;st.pick=null;st.mk=mk(st.list[st.i]);rStudy()}
function learn(n){S.learned[n]=1;save();buildList(true);rStudy()}
function fav(n){S.fav[n]?delete S.fav[n]:S.fav[n]=1;save();tab=='hist'?rHist():rStudy()}
function rHist(){
 const tabs=[['wrong','❌ Đã sai'],['learned','✔ Đã thuộc'],['fav','⭐ Yêu thích']];
 const ids=Object.keys(S[hist]).map(Number),items=Q.filter(q=>ids.includes(q.n));
 if(hist=='wrong')items.sort((a,b)=>S.wrong[b.n].c-S.wrong[a.n].c);
 $('app').innerHTML=`<div class="row">${tabs.map(([k,v])=>`<button class="b ${hist==k?'p':''}" onclick="hist='${k}';rHist()">${v} (${Object.keys(S[k]).length})</button>`).join('')}</div>
 ${items.length?items.map(q=>`<div class="c"><div class="q">#${q.n}. ${q.q}</div><div class="good">Đáp án: ${q.a}</div>${hist=='wrong'?`<p class="warn">Sai ${S.wrong[q.n].c} lần</p>`:''}

/* THI THỬ */
function rExam(){
 if(!ex){$('app').innerHTML=`<div class="c"><h3>Thi thử</h3><p>50 câu ngẫu nhiên · 68 phút · tính điểm thang 10.</p><button class="b p" onclick="startEx()">Bắt đầu làm bài</button></div>`;return}
 if(ex.done)return rResult();
 const e=ex,m=e.items[e.i],r=Math.max(0,e.end-Date.now());
 $('app').innerHTML=`<div class="c"><div class="row"><b>Câu ${e.i+1}/50</b><span class="sp"></span><span>⏱ <span id="tm" class="tm"></span></span></div>
 <div class="q">${m.q.q}</div>${m.o.map((o,k)=>`<button class="o ${e.ans[e.i]===k?'sel':''}" onclick="exPick(${k})"><i>${L[k]}</i><span>${o.t}</span></button>`).join('')}
 <div class="row"><button class="b" onclick="exGo(${e.i-1})">← Trước</button><button class="b" onclick="exGo(${e.i+1})">Sau →</button><span class="sp"></span><button class="b p" onclick="submitEx()">Nộp bài</button></div></div>
 <div class="c"><div class="mu">Đã làm ${e.ans.filter(x=>x!=null).length}/50</div><div class="grid">${e.items.map((_,k)=>`<button class="${e.ans[k]!=null?'done':''} ${k==e.i?'cur':''}" onclick="exGo(${k})">${k+1}</button>`).join('')}</div></div>`;tick()}
function startEx(){ex={items:sh(Q).slice(0,50).map(mk),ans:Array(50).fill(null),i:0,end:Date.now()+68*60000,done:false};clearInterval(timer);timer=setInterval(tick,1000);rExam()}
function tick(){if(!ex||ex.done)return;const r=ex.end-Date.now();if(r<=0){alert('Hết giờ! Bài thi được nộp tự động.');finish();return}const t=$('tm');if(t){const s=Math.ceil(r/1000);t.textContent=String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');t.className='tm'+(s<300?' lo':'')}}
function exPick(k){ex.ans[ex.i]=k;rExam()}function exGo(i){ex.i=Math.min(49,Math.max(0,i));rExam()}
function submitEx(){const u=ex.ans.filter(x=>x==null).length;if(confirm(u?`Còn ${u} câu chưa làm. Bạn chắc chắn muốn nộp bài?`:'Xác nhận nộp bài?'))finish()}
function finish(){clearInterval(timer);ex.done=true;ex.items.forEach((m,k)=>{if(ex.ans[k]!=null&&!m.o[ex.ans[k]].c){const w=S.wrong[m.q.n]||{c:0};w.c++;S.wrong[m.q.n]=w}});save();ex.show='all';if(tab=='exam')rExam()}
function rResult(){
 const e=ex,ok=e.items.filter((m,k)=>e.ans[k]!=null&&m.o[e.ans[k]].c).length,sc=(ok/50*10).toFixed(2);
 const f=e.show,list=e.items.map((m,k)=>[m,k]).filter(([m,k])=>f=='all'||(f=='wrong'&&!(e.ans[k]!=null&&m.o[e.ans[k]].c)));
 $('app').innerHTML=`<div class="c" style="text-align:center"><div class="mu">Kết quả</div><div class="big">${sc}/10</div><div>Đúng ${ok}/50 · Sai ${50-ok-e.ans.filter(x=>x==null).length} · Bỏ trống ${e.ans.filter(x=>x==null).length}</div>
 <div class="row" style="justify-content:center"><button class="b ${f=='all'?'p':''}" onclick="ex.show='all';rExam()">Xem tất cả</button><button class="b ${f=='wrong'?'p':''}" onclick="ex.show='wrong';rExam()">Chỉ câu sai/bỏ trống</button><button class="b" onclick="ex=null;rExam()">Làm đề mới</button></div></div>
 ${list.map(([m,k])=>{const a=e.ans[k];return `<div class="c"><div class="mu">Câu ${k+1} · ${a==null?'Bỏ trống':m.o[a].c?'✅ Đúng':'❌ Sai'}</div><div class="q">${m.q.q}</div>${m.o.map((o,j)=>`<div class="o ${o.c?'ok':(j==a?'no':'')}"><i>${L[j]}</i><span>${o.t}${j==a?' ← bạn chọn':''}</span></div>`).join('')}${m.q.note?`<p class="mu">💡 ${m.q.note}</p>`:''}</div>`}).join('')}`}
buildList();render();
</script></body></html>

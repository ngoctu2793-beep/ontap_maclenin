<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Ôn tập Kinh tế chính trị Mác - Lênin</title>
<style>
:root[data-theme="dark"]{color-scheme:dark;--bg:#12161c;--card:#1b222b;--tx:#e8ecf1;--mu:#9aa5b4;--bd:#2d3744;--pr:#6c8cff;--ok:#143a25;--okb:#35c97a;--no:#4a1c1c;--nob:#ff6b6b}
:root[data-theme="light"]{color-scheme:light}
.hd{display:flex;align-items:center;gap:8px}.hd h2{flex:1;margin:6px 0}.th{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:7px 12px;cursor:pointer;font:inherit;font-size:14px;white-space:nowrap}
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mu:#667085;--bd:#dfe3e8;--pr:#2f5bea;--ok:#d6f5df;--okb:#1f9d55;--no:#fde0e0;--nob:#d93636;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b222b;--tx:#e8ecf1;--mu:#9aa5b4;--bd:#2d3744;--pr:#6c8cff;--ok:#143a25;--okb:#35c97a;--no:#4a1c1c;--nob:#ff6b6b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:820px;margin:0 auto;padding:12px}
nav{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5;overflow-x:auto}
nav button,.b{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:10px;cursor:pointer;font:inherit;white-space:nowrap}
nav button.on,.b.p{background:var(--pr);color:#fff;border-color:var(--pr)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:10px 0}
.q{font-weight:600;font-size:17px;margin:6px 0 12px}.mu{color:var(--mu);font-size:14px}
.o{display:flex;gap:10px;width:100%;text-align:left;border:2px solid var(--bd);background:var(--card);color:var(--tx);padding:11px 12px;border-radius:10px;margin:8px 0;cursor:pointer;font:inherit}
.o i{font-style:normal;font-weight:700;min-width:22px}.o.sel{border-color:var(--pr)}
.o.ok{background:var(--ok);border-color:var(--okb)}.o.no{background:var(--no);border-color:var(--nob)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}.sp{flex:1}
.warn{color:var(--nob);font-weight:600}.good{color:var(--okb);font-weight:600}
select{padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.grid{display:flex;flex-wrap:wrap;gap:5px}.grid button{width:38px;height:34px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;cursor:pointer}
.grid .done{background:var(--pr);color:#fff}.grid .cur{outline:2px solid var(--tx)}.grid .ok{background:var(--okb);color:#fff}.grid .no{background:var(--nob);color:#fff}
.big{font-size:44px;font-weight:800}.tm{font-weight:700;font-variant-numeric:tabular-nums}.tm.lo{color:var(--nob)}
.b.sm{padding:5px 10px;font-size:14px}.fav{color:#e0a200}
</style></head><body><div class="w">
<div class="hd"><h2>📘 Ôn tập Kinh tế chính trị Mác - Lênin</h2><button id="th" class="th" onclick="toggleTheme()" aria-label="Chuyển giao diện sáng/tối"></button></div>
<nav id="nav"></nav><div id="app"></div></div>
<script>
function curTheme(){let t=null;try{t=localStorage.getItem('ktct_theme')}catch(e){}return t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function setTheme(t,keep){document.documentElement.setAttribute('data-theme',t);const b=document.getElementById('th');if(b)b.textContent=t=='dark'?'☀️ Sáng':'🌙 Tối';if(keep)try{localStorage.setItem('ktct_theme',t)}catch(e){}}
function toggleTheme(){setTheme(document.documentElement.getAttribute('data-theme')=='dark'?'light':'dark',true)}
setTheme(curTheme(),false);
const Q=[{"n": 1, "p": 0, "q": "Việc gạt bỏ các yếu tố ngẫu nhiên, tạm thời, bề ngoài để đi sâu nắm bắt bản chất, quy luật bên trong của các hiện tượng và quá trình kinh tế được gọi là phương pháp gì?", "a": "Phương pháp trừu tượng hoá khoa học", "note": "Phương pháp nghiên cứu cơ bản trong KTCT Mác - Lênin.", "d": ["Phương pháp phân tích và tổng hợp lịch sử", "Phương pháp mô hình hoá toán học kinh tế", "Phương pháp thống kê và so sánh số liệu thực nghiệm"]}, {"n": 2, "p": 0, "q": "Cơ sở chung sâu xa nhất để hai hàng hóa có giá trị sử dụng hoàn toàn khác nhau có thể so sánh và trao đổi được với nhau theo một tỷ lệ nhất định là gì?", "a": "Hao phí lao động xã hội kết tinh trong hàng hóa (lao động chung của người sản xuất)", "note": "Bản chất tạo nên giá trị hàng hóa.", "d": ["Mức độ khan hiếm tương đối của hai hàng hóa trên thị trường", "Nhu cầu tiêu dùng và sở thích của người mua hai hàng hóa", "Số lượng tiền tệ dùng để mua bán hai hàng hóa đó"]}, {"n": 3, "p": 0, "q": "Một chiếc điện thoại thông minh vừa dùng để gọi điện, nhắn tin, vừa chụp ảnh, quay phim, thanh toán và theo dõi sức khỏe. Điều này phản ánh đặc điểm nào của giá trị sử dụng?", "a": "Giá trị sử dụng (tính hữu ích của vật thể), một vật có thể có nhiều giá trị sử dụng khác nhau do thuộc tính tự nhiên quy định", "note": "Thuộc tính tự nhiên của hàng hóa.", "d": ["Giá trị của hàng hóa, một vật có thể có nhiều giá trị khác nhau do lao động trừu tượng quy định", "Giá trị trao đổi của hàng hóa, vốn do quan hệ cung - cầu trên thị trường quy định", "Tính hữu ích của vật thể, mỗi vật chỉ có một giá trị sử dụng duy nhất do người sản xuất quy định"]}, {"n": 4, "p": 0, "q": "Một người thợ may và một người nông dân trồng lúa thực hiện hai công việc hoàn toàn khác nhau. Xét dưới góc độ lao động trừu tượng, hai loại lao động này:", "a": "Đều là sự hao phí sức lao động nói chung của con người (về cơ bắp, thần kinh) không kể hình thức cụ thể, và chúng đồng chất với nhau (tạo ra giá trị)", "note": "Lao động trừu tượng tạo ra giá trị hàng hóa.", "d": ["Khác nhau về chất vì mỗi loại lao động có mục đích, đối tượng và phương pháp riêng nên không thể so sánh được", "Đều là lao động cụ thể tạo ra giá trị sử dụng, nhưng chỉ lao động của người thợ may mới tạo ra giá trị", "Chỉ đồng chất khi cùng một ngành nghề và sử dụng công cụ lao động giống nhau"]}, {"n": 5, "p": 0, "q": "Những yếu tố nào sau đây có thể góp phần nâng cao năng suất lao động?", "a": "Trình độ khéo léo của người lao động, mức độ phát triển của khoa học - kỹ thuật, công nghệ, mức độ ứng dụng vào sản xuất, phương pháp tổ chức sản xuất và điều kiện tự nhiên", "note": "Các nhân tố ảnh hưởng trực tiếp đến năng suất lao động.", "d": ["Trình độ khéo léo của người lao động, mức độ khan hiếm tài nguyên và sự biến động của giá cả thị trường", "Cường độ lao động, thời gian làm việc trong ngày, mức tiền công và quy mô thị trường tiêu thụ", "Số lượng công nhân, mức độ cạnh tranh giữa các doanh nghiệp, chính sách thuế và tỷ giá hối đoái"]}, {"n": 6, "p": 0, "q": "Phát biểu nào sau đây phản ánh đúng nhất sự khác nhau giữa năng suất lao động và cường độ lao động?", "a": "Năng suất lao động làm thay đổi lượng giá trị của một đơn vị sản phẩm (tỷ lệ nghịch), còn cường độ lao động làm tăng số lượng sản phẩm và tổng lượng giá trị trong một đơn vị thời gian nhưng không làm thay đổi giá trị của một đơn vị sản phẩm", "note": "Phân biệt rõ tác động khác nhau của NSLĐ và CĐLĐ.", "d": ["Năng suất lao động làm tăng tổng lượng giá trị của một đơn vị sản phẩm, còn cường độ lao động làm giảm giá trị của một đơn vị sản phẩm", "Cả hai đều làm giảm lượng giá trị của một đơn vị sản phẩm, chỉ khác nhau ở mức độ giảm nhiều hay ít", "Năng suất lao động gắn với việc kéo dài thời gian làm việc, còn cường độ lao động gắn với trình độ kỹ thuật"]}, {"n": 7, "p": 0, "q": "Giả sử năng suất lao động xã hội tăng, đồng thời cường độ lao động cũng tăng, các yếu tố khác không đổi. Nhận định nào sau đây chính xác nhất?", "a": "Tổng số lượng sản phẩm làm ra tăng lên rất nhiều, tổng lượng giá trị tăng lên (hoặc không đổi tùy cách tính tổng), nhưng lượng giá trị của một đơn vị sản phẩm giảm xuống", "note": "Tác động kết hợp (tác động kép).", "d": ["Tổng số lượng sản phẩm tăng, tổng lượng giá trị giảm xuống, và lượng giá trị của một đơn vị sản phẩm không đổi", "Tổng số lượng sản phẩm không đổi, tổng lượng giá trị tăng lên, nhưng lượng giá trị của một đơn vị sản phẩm giảm xuống", "Tổng số lượng sản phẩm tăng, tổng lượng giá trị tăng, và lượng giá trị của một đơn vị sản phẩm cũng tăng lên"]}, {"n": 8, "p": 0, "q": "Nếu tất cả những người sản xuất trong một ngành đồng thời nâng cao năng suất lao động ở cùng một mức, trong điều kiện các yếu tố khác không đổi, kết luận nào đúng nhất?", "a": "Tổng lượng giá trị của tổng số sản phẩm làm ra trong một đơn vị thời gian không đổi, nhưng giá trị của một đơn vị sản phẩm giảm xuống", "note": "Tổng giá trị trong 1 đơn vị thời gian không đổi khi NSLĐ xã hội tăng.", "d": ["Tổng lượng giá trị tăng lên tương ứng với mức tăng năng suất, còn giá trị của một đơn vị sản phẩm không đổi", "Tổng lượng giá trị giảm xuống, đồng thời giá trị của một đơn vị sản phẩm cũng giảm xuống", "Tổng lượng giá trị không đổi, và giá trị của một đơn vị sản phẩm cũng không đổi"]}, {"n": 9, "p": 0, "q": "Nếu một hàng hóa có giá trị sử dụng rất cao nhưng không có nhu cầu xã hội đối với nó, suy luận nào phù hợp nhất theo nội dung trên?", "a": "Hàng hóa đó không bán được, tức là lao động hao phí để sản xuất ra nó không được xã hội thừa nhận, giá trị của nó không được thực hiện", "note": "Hàng hóa phải thỏa mãn nhu cầu xã hội.", "d": ["Hàng hóa đó vẫn bán được với giá cao vì có giá trị sử dụng lớn, giá trị của nó vẫn được thực hiện", "Hàng hóa đó không bán được, nhưng lao động hao phí để sản xuất ra nó vẫn tạo ra giá trị đầy đủ", "Hàng hóa đó chỉ bán được khi Nhà nước can thiệp, và giá trị của nó do Nhà nước quy định"]}, {"n": 10, "p": 0, "q": "Một sản phẩm đang được bán trên thị trường với mức giá cao hơn giá trị của nó. Nếu giả định không có độc quyền, không có sự can thiệp của Nhà nước và sức mua của tiền không đổi, kết luận nào sau đây có khả năng giải thích phù hợp nhất?", "a": "Cung nhỏ hơn Cầu (Cung < Cầu)", "note": "Tác động của quan hệ cung - cầu.", "d": ["Cung lớn hơn Cầu (Cung > Cầu)", "Cung bằng Cầu (Cung = Cầu)", "Cung và Cầu cùng tăng (Cung ↑, Cầu ↑)"]}, {"n": 11, "p": 0, "q": "Khi phân biệt sự tác động của năng suất lao động và cường độ lao động, nhận định nào sau đây là ĐÚNG về sự thay đổi lượng giá trị của một đơn vị hàng hóa?", "a": "Năng suất lao động tăng làm lượng giá trị của một đơn vị hàng hóa giảm; còn cường độ lao động tăng không làm thay đổi lượng giá trị của một đơn vị hàng hóa", "note": "Quy tắc cốt lõi khi làm bài tập trắc nghiệm.", "d": ["Năng suất lao động tăng làm lượng giá trị của một đơn vị hàng hóa không đổi; còn cường độ lao động tăng làm lượng giá trị đó giảm", "Cả năng suất lao động và cường độ lao động tăng đều làm lượng giá trị của một đơn vị hàng hóa giảm", "Năng suất lao động tăng làm lượng giá trị của một đơn vị hàng hóa tăng; còn cường độ lao động tăng làm lượng giá trị đó giảm"]}, {"n": 12, "p": 0, "q": "Giả sử một công nhân trong 1 ngày lao động (8 giờ) sản xuất được 10 sản phẩm, tổng giá trị là 100 USD. Nếu cường độ lao động tăng lên 2 lần (các yếu tố khác như năng suất, trình độ kỹ thuật không đổi), kết quả nào sau đây sẽ xảy ra trong 1 ngày lao động đó?", "a": "Số lượng sản phẩm là 20, tổng giá trị là 200 USD, nhưng giá trị của 1 sản phẩm vẫn giữ nguyên", "note": "CĐLĐ tăng không làm đổi giá trị 1 đơn vị sản phẩm.", "d": ["Số lượng sản phẩm là 20, tổng giá trị là 100 USD, và giá trị của 1 sản phẩm giảm xuống còn 5 USD", "Số lượng sản phẩm là 10, tổng giá trị là 200 USD, nhưng giá trị của 1 sản phẩm tăng lên 20 USD", "Số lượng sản phẩm là 20, tổng giá trị là 200 USD, và giá trị của 1 sản phẩm giảm xuống còn 5 USD"]}, {"n": 13, "p": 0, "q": "Trong quá trình trao đổi hàng hóa trên thị trường, lượng giá trị của hàng hóa do lao động phức tạp tạo ra được xác định dựa trên cơ sở nào?", "a": "Được quy đổi thành lao động giản đơn trung bình nhân bội lên trong cùng một khoảng thời gian", "note": "Lao động phức tạp = Lao động giản đơn nhân bội lên.", "d": ["Được quy đổi thành lao động cụ thể trung bình trong cùng một khoảng thời gian", "Được tính bằng đúng thời gian lao động cá biệt của người thợ có trình độ cao", "Được xác định theo mức tiền công cao hơn mà người lao động phức tạp nhận được"]}, {"n": 14, "p": 0, "q": "Theo lý thuyết Kinh tế chính trị Mác - Lênin, tính chất hai mặt của lao động sản xuất hàng hóa (lao động cụ thể và lao động trừu tượng) có mối quan hệ như thế nào với quá trình hình thành hai thuộc tính của hàng hóa?", "a": "Lao động cụ thể tạo ra giá trị sử dụng của hàng hóa; lao động trừu tượng tạo ra giá trị của hàng hóa", "note": "Mối quan hệ nhân quả trực tiếp.", "d": ["Lao động cụ thể tạo ra giá trị của hàng hóa; lao động trừu tượng tạo ra giá trị sử dụng của hàng hóa", "Lao động cụ thể và lao động trừu tượng cùng tạo ra giá trị sử dụng; giá trị do quan hệ cung - cầu quyết định", "Lao động cụ thể tạo ra giá trị sử dụng của hàng hóa; lao động trừu tượng chỉ làm thay đổi giá cả của hàng hóa"]}, {"n": 15, "p": 0, "q": "Nhận định nào sau đây là ĐÚNG khi nói về \"lao động trừu tượng\" trong nền sản xuất hàng hóa?", "a": "Là phạm trù lịch sử, chỉ tồn tại trong nền sản xuất hàng hóa (là sự hao phí sức lao động nói chung của con người)", "note": "Lao động cụ thể là vĩnh viễn, lao động trừu tượng là lịch sử.", "d": ["Là phạm trù vĩnh viễn, tồn tại trong mọi phương thức sản xuất (là sự hao phí sức lao động có mục đích, có ích)", "Là lao động tạo ra giá trị sử dụng của hàng hóa (là lao động có hình thức, phương pháp riêng)", "Là phạm trù lịch sử, chỉ tồn tại trong chủ nghĩa tư bản (là lao động của công nhân làm thuê)"]}, {"n": 16, "p": 0, "q": "Theo lý thuyết Kinh tế chính trị Mác - Lênin, sự khác biệt căn bản về nguồn gốc tạo ra hai thuộc tính của hàng hóa là gì?", "a": "Giá trị sử dụng do thuộc tính tự nhiên của lao động cụ thể tạo ra; còn giá trị do thuộc tính xã hội của lao động trừu tượng tạo ra", "note": "Phân biệt rõ nguồn gốc tự nhiên và xã hội.", "d": ["Giá trị sử dụng do thuộc tính xã hội của lao động trừu tượng tạo ra; còn giá trị do thuộc tính tự nhiên của lao động cụ thể tạo ra", "Giá trị sử dụng do quan hệ cung - cầu quyết định; còn giá trị do thuộc tính tự nhiên của lao động cụ thể tạo ra", "Cả giá trị sử dụng và giá trị đều do thuộc tính tự nhiên của lao động cụ thể tạo ra"]}, {"n": 17, "p": 0, "q": "Nhận định nào sau đây phản ánh đúng sự khác biệt về tính chất phạm trù giữa giá trị sử dụng và giá trị của hàng hóa?", "a": "Giá trị sử dụng là phạm trù vĩnh viễn; giá trị là phạm trù lịch sử (chỉ tồn tại trong kinh tế hàng hóa)", "note": "Bản chất lịch sử của phạm trù giá trị.", "d": ["Giá trị sử dụng là phạm trù lịch sử; giá trị là phạm trù vĩnh viễn (tồn tại trong mọi phương thức sản xuất)", "Cả giá trị sử dụng và giá trị đều là phạm trù vĩnh viễn (tồn tại trong mọi phương thức sản xuất)", "Cả giá trị sử dụng và giá trị đều là phạm trù lịch sử (chỉ tồn tại trong kinh tế hàng hóa)"]}, {"n": 18, "p": 0, "q": "Trình tự phát triển nào sau đây phản ánh đúng quá trình hình thành tiền từ các hình thái giá trị?", "a": "Hình thái giá trị giản đơn (hoặc ngẫu nhiên) → Hình thái giá trị đầy đủ (hoặc mở rộng) → Hình thái chung → Hình thái tiền tệ", "note": "4 hình thái phát triển giá trị.", "d": ["Hình thái giá trị đầy đủ → Hình thái giá trị giản đơn → Hình thái chung → Hình thái tiền tệ", "Hình thái giá trị giản đơn → Hình thái chung → Hình thái giá trị đầy đủ → Hình thái tiền tệ", "Hình thái chung → Hình thái giá trị giản đơn → Hình thái giá trị đầy đủ → Hình thái tiền tệ"]}, {"n": 19, "p": 0, "q": "Theo quan điểm của Kinh tế chính trị Mác - Lênin, sự ra đời của tiền tệ là kết quả của:", "a": "Quá trình phát triển lâu dài của sản xuất và trao đổi hàng hóa, là kết quả của quá trình phát triển các hình thái giá trị từ thấp đến cao", "note": "Tiền là sản phẩm của lịch sử trao đổi.", "d": ["Quyết định của Nhà nước nhằm thống nhất thước đo giá trị trong phạm vi quốc gia, cùng sự phát triển của thương mại quốc tế", "Sự thỏa thuận của những người sản xuất hàng hóa nhằm thuận tiện cho trao đổi, cùng sự khan hiếm của kim loại quý", "Quá trình phát triển của sản xuất tư bản chủ nghĩa, là kết quả của sự xuất hiện lao động làm thuê"]}, {"n": 20, "p": 0, "q": "Nhận định nào sau đây phản ánh đúng và đầy đủ nhất bản chất của tiền?", "a": "Tiền là hàng hóa đặc biệt, được tách ra làm vật ngang giá chung cho thế giới hàng hóa, phản ánh quan hệ sản xuất giữa những người sản xuất hàng hóa", "note": "Ghi nhớ cụm từ: \"hàng hóa đặc biệt\".", "d": ["Tiền là hàng hóa thông thường, được Nhà nước quy định làm vật ngang giá chung, phản ánh quan hệ giữa Nhà nước và người dân", "Tiền là hàng hóa đặc biệt, được tách ra làm vật ngang giá chung, chỉ phản ánh quan hệ giữa người mua và người bán", "Tiền là vật ngang giá chung do có giá trị sử dụng cao nhất, phản ánh quan hệ sản xuất giữa những người lao động"]}, {"n": 21, "p": 0, "q": "Khi một doanh nghiệp mua nguyên vật liệu từ đối tác nhưng thỏa thuận trả chậm, sau 3 tháng mới đem tiền đến trả nợ cho đối tác. Trong trường hợp này, tiền đang thực hiện chức năng gì?", "a": "Chức năng phương tiện thanh toán", "note": "Phân biệt với phương tiện lưu thông (mua bán trả tiền ngay).", "d": ["Chức năng thước đo giá trị", "Chức năng phương tiện lưu thông", "Chức năng phương tiện cất trữ"]}, {"n": 22, "p": 0, "q": "Trong sự phát triển của nền kinh tế thị trường, công thức tính lượng tiền cần thiết cho lưu thông phải điều chỉnh (trừ đi hàng hóa bán chịu và khấu trừ cho nhau, cộng thêm hàng hóa đến kỳ thanh toán). Sự điều chỉnh phức tạp này phản ánh hệ quả trực tiếp từ việc tiền tệ thực hiện chức năng nào?", "a": "Chức năng phương tiện thanh toán", "note": "Mua bán chịu làm sinh ra chức năng thanh toán.", "d": ["Chức năng thước đo giá trị", "Chức năng phương tiện cất trữ", "Chức năng tiền tệ thế giới"]}, {"n": 23, "p": 0, "q": "Chọn phương án đúng: Lượng giá trị của hàng hóa được quyết định bởi yếu tố nào:", "a": "Thời gian lao động xã hội cần thiết", "note": "Yếu tố quyết định khách quan.", "d": ["Thời gian lao động cá biệt của người sản xuất", "Mức độ khan hiếm của hàng hóa trên thị trường", "Giá trị sử dụng và công dụng của hàng hóa"]}, {"n": 24, "p": 0, "q": "Nhân tố nào không ảnh hưởng đến năng suất lao động?", "a": "Cường độ lao động", "note": "Phân biệt rõ NSLĐ và CĐLĐ.", "d": ["Trình độ khéo léo của người lao động", "Mức độ ứng dụng khoa học - kỹ thuật vào sản xuất", "Phương pháp tổ chức và quản lý sản xuất"]}, {"n": 25, "p": 0, "q": "Chọn phương án đúng: Lao động trừu tượng là:", "a": "Sự hao phí sức lao động của người sản xuất hàng hóa về cơ bắp, thần kinh không kể đến hình thức cụ thể của nó", "note": "Hao phí sinh lý của con người.", "d": ["Sự hao phí sức lao động của người sản xuất hàng hóa theo một hình thức cụ thể, xác định về mục đích và phương pháp", "Lao động của người sản xuất hàng hóa tạo ra giá trị sử dụng, được thể hiện qua công cụ và đối tượng lao động", "Sự hao phí sức lao động của người sản xuất hàng hóa về cơ bắp, thần kinh, chỉ tồn tại trong chủ nghĩa tư bản"]}, {"n": 26, "p": 0, "q": "Chọn phương án đúng: Giá trị cá biệt của hàng hoá do:", "a": "Hao phí lao động cá biệt của từng người sản xuất quyết định", "note": "Quyết định năng lực cạnh tranh doanh nghiệp.", "d": ["Hao phí lao động xã hội cần thiết của toàn ngành sản xuất quyết định", "Mức độ khan hiếm của hàng hóa trên thị trường quyết định", "Giá cả mà người mua chấp nhận trả cho hàng hóa quyết định"]}, {"n": 27, "p": 0, "q": "Chọn phương án đúng: Tiền là một loại hàng hóa đặc biệt vì:", "a": "Nó đóng vai trò là vật ngang giá chung cho tất cả các hàng hóa khác", "note": "Đặc điểm độc quyền làm vật ngang giá.", "d": ["Nó có giá trị sử dụng lớn nhất trong tất cả các hàng hóa khác", "Nó do Nhà nước phát hành và bảo đảm giá trị cho mọi hàng hóa", "Nó được làm từ kim loại quý có số lượng khan hiếm trong tự nhiên"]}, {"n": 28, "p": 0, "q": "Chọn phương án đúng: Tiền có 5 chức năng, chức năng nào không đòi hỏi có tiền vàng (tiền mặt thực tế)?", "a": "Chức năng phương tiện thanh toán và chức năng tiền tệ thế giới (có thể dùng tín dụng, bút tệ hoặc thanh toán quốc tế)", "note": "Giao dịch tín dụng không cần tiền mặt ngay.", "d": ["Chức năng phương tiện cất trữ và chức năng phương tiện lưu thông (cần có tiền vàng hoặc tiền mặt thực tế)", "Chức năng phương tiện lưu thông và chức năng tiền tệ thế giới (luôn đòi hỏi tiền vàng)", "Chức năng phương tiện cất trữ và chức năng tiền tệ thế giới (luôn đòi hỏi tiền vàng)"]}, {"n": 29, "p": 0, "q": "Theo Kinh tế chính trị Mác - Lênin, sản xuất hàng hóa chỉ ra đời và tồn tại khi có đủ hai điều kiện nào sau đây?", "a": "Phân công lao động xã hội và sự tách biệt về mặt kinh tế (độc lập) giữa các chủ thể sản xuất", "note": "Bắt buộc phải có **đ****ủ**** hai** điều kiện.", "d": ["Phân công lao động xã hội và sự phát triển của khoa học - kỹ thuật trong các ngành sản xuất", "Sự tách biệt về mặt kinh tế giữa các chủ thể sản xuất và sự can thiệp điều tiết của Nhà nước", "Chế độ tư hữu về tư liệu sản xuất và sự xuất hiện của tiền tệ trong trao đổi"]}, {"n": 30, "p": 0, "q": "Yếu tố nào dưới đây là nguyên nhân sâu xa dẫn đến sự tách biệt tương đối về mặt kinh tế giữa những chủ thể sản xuất khác nhau?", "a": "Chế độ tư hữu về tư liệu sản xuất", "note": "Sở hữu khác nhau sinh ra độc lập kinh tế.", "d": ["Sự phát triển của phân công lao động xã hội", "Sự phát triển của lực lượng sản xuất", "Sự ra đời và phát triển của thị trường"]}, {"n": 31, "p": 0, "q": "Quy luật kinh tế cơ bản nào chi phối sản xuất và trao đổi hàng hoá?", "a": "Quy luật giá trị", "note": "Quy luật cốt lõi của kinh tế hàng hóa.", "d": ["Quy luật cung - cầu", "Quy luật cạnh tranh", "Quy luật lưu thông tiền tệ"]}, {"n": 32, "p": 0, "q": "Chọn phương án đúng: Tác dụng của quy luật giá trị:", "a": "Điều tiết sản xuất và lưu thông hàng hóa; kích thích cải tiến kỹ thuật, tăng năng suất lao động; phân hóa người sản xuất thành giàu, nghèo", "note": "3 tác dụng lớn của quy luật giá trị.", "d": ["Điều tiết sản xuất và lưu thông hàng hóa; kìm hãm cải tiến kỹ thuật; phân hóa người sản xuất thành giàu, nghèo", "Điều tiết sản xuất và lưu thông hàng hóa; kích thích cải tiến kỹ thuật; xóa bỏ phân hóa giàu, nghèo", "Ổn định giá cả hàng hóa; kích thích cải tiến kỹ thuật, tăng năng suất lao động; phân hóa người sản xuất thành giàu, nghèo"]}, {"n": 33, "p": 0, "q": "Trong sự ra đời của sản xuất hàng hóa, phân công lao động xã hội đóng vai trò là điều kiện cần vì nó trực tiếp tạo ra trạng thái nào sau đây trong xã hội?", "a": "Sự chuyên môn hóa lao động, khiến những người sản xuất phụ thuộc vào nhau và buộc phải trao đổi sản phẩm cho nhau", "note": "Điều kiện cần để xuất hiện trao đổi.", "d": ["Sự độc lập về kinh tế của từng người sản xuất, khiến họ tự quyết định sản xuất và sở hữu sản phẩm của mình", "Sự xuất hiện của chế độ tư hữu, khiến những người sản xuất phải mua bán sức lao động cho nhau", "Sự phát triển của tiền tệ, khiến những người sản xuất buộc phải trao đổi sản phẩm qua thị trường"]}, {"n": 34, "p": 0, "q": "Cặp phạm trù nào dưới đây là phát hiện riêng của C.Mác?", "a": "Lao động cụ thể và Lao động trừu tượng", "note": "Phát hiện vĩ đại của C. Mác.", "d": ["Sản xuất hàng hóa và Trao đổi hàng hóa", "Giá trị sử dụng và Giá trị", "Hàng hóa và Tiền tệ"]}, {"n": 35, "p": 0, "q": "Theo nội dung của quy luật giá trị, việc sản xuất và trao đổi hàng hóa phải được tiến hành dựa trên cơ sở nào?", "a": "Cơ sở hao phí lao động xã hội cần thiết (nguyên tắc trao đổi ngang giá)", "note": "Nguyên tắc trao đổi ngang giá.", "d": ["Cơ sở hao phí lao động cá biệt (nguyên tắc trao đổi theo giá thị trường)", "Cơ sở quan hệ cung - cầu (nguyên tắc giá cả theo mức độ khan hiếm)", "Cơ sở giá trị sử dụng của hàng hóa (nguyên tắc trao đổi theo nhu cầu)"]}, {"n": 36, "p": 0, "q": "Để tồn tại, phát triển trong môi trường cạnh tranh, quy luật giá trị bắt buộc những người sản xuất hàng hóa phải điều chỉnh lượng hao phí lao động cá biệt của mình như thế nào?", "a": "Phải tìm cách hạ thấp hao phí lao động cá biệt nhỏ hơn hoặc bằng thời gian lao động xã hội cần thiết (Hao phí cá biệt ≤ Hao phí xã hội cần thiết)", "note": "Bí quyết thắng lợi trong cạnh tranh.", "d": ["Phải tìm cách nâng hao phí lao động cá biệt bằng thời gian lao động xã hội cần thiết (Hao phí cá biệt = Hao phí xã hội cần thiết)", "Phải giữ hao phí lao động cá biệt lớn hơn thời gian lao động xã hội cần thiết (Hao phí cá biệt > Hao phí xã hội cần thiết)", "Phải điều chỉnh hao phí lao động cá biệt theo biến động của giá cả thị trường (Hao phí cá biệt ∝ Giá cả)"]}, {"n": 37, "p": 0, "q": "Trong lĩnh vực lưu thông, quy luật giá trị hoạt động thông qua nguyên tắc nào và sự vận động của giá cả thị trường diễn ra ra sao?", "a": "Giá cả thị trường lên xuống xoay quanh giá trị hàng hóa dưới sự chi phối của quan hệ cung - cầu", "note": "Giá cả xoay quanh giá trị.", "d": ["Giá cả thị trường luôn bằng giá trị hàng hóa, không chịu tác động của quan hệ cung - cầu", "Giá cả thị trường tăng giảm theo chi phí sản xuất cá biệt dưới sự điều tiết của Nhà nước", "Giá cả thị trường lên xuống xoay quanh giá trị sử dụng dưới sự chi phối của quan hệ cung - cầu"]}, {"n": 38, "p": 0, "q": "Quy luật giá trị thực hiện việc điều tiết sản xuất và lưu thông hàng hóa thông qua sự biến động của yếu tố nào trên thị trường?", "a": "Biến động của giá cả thị trường", "note": "Giá cả là tín hiệu thị trường.", "d": ["Biến động của lượng tiền trong lưu thông", "Biến động của hao phí lao động cá biệt", "Biến động của chính sách thuế và lãi suất"]}, {"n": 39, "p": 0, "q": "Quy luật giá trị là quy luật kinh tế cơ bản và tồn tại khách quan trong mô hình kinh tế nào dưới đây?", "a": "Nền sản xuất hàng hóa (Kinh tế thị trường)", "note": "Gắn liền với sản xuất hàng hóa.", "d": ["Nền sản xuất tự cung tự cấp (Kinh tế tự nhiên)", "Nền sản xuất kế hoạch hóa (Kinh tế chỉ huy)", "Nền sản xuất tư bản chủ nghĩa (Kinh tế tư bản độc quyền)"]}, {"n": 40, "p": 1, "q": "Chọn phương án đúng: Khi nào tiền biến thành tư bản?", "a": "Khi tiền được đầu tư vào lưu thông nhằm mục đích mang lại giá trị thặng dư (T-H-T') và hàng hóa sức lao động trở thành hàng hóa", "note": "Công thức chung của tư bản.", "d": ["Khi tiền được dùng để mua tư liệu tiêu dùng nhằm thỏa mãn nhu cầu sinh hoạt của chủ sở hữu", "Khi tiền được cất trữ lâu dài và dùng làm phương tiện thanh toán trong trao đổi hàng hóa", "Khi tiền được đưa vào lưu thông theo công thức H-T-H nhằm mua bán hàng hóa lấy giá trị sử dụng"]}, {"n": 41, "p": 1, "q": "Chọn phương án đúng về: Những nhân tố thúc đẩy và tạo điều kiện ra đời của PTSX tư bản chủ nghĩa:", "a": "Tích lũy nguyên thủy tư bản và sự hình thành giai cấp những người lao động tự do nhưng bị tước đoạt tư liệu sản xuất", "note": "Điều kiện lịch sử hình thành CNTB.", "d": ["Tích lũy nguyên thủy tư bản và sự hình thành giai cấp địa chủ phong kiến nắm giữ ruộng đất", "Sự phát triển của thương mại quốc tế và sự hình thành giai cấp tư sản thương nhân", "Sự ra đời của tiền tệ và sự hình thành giai cấp những người sản xuất hàng hóa nhỏ"]}, {"n": 42, "p": 1, "q": "Chọn phương án không đúng: Điểm khác căn bản giữa công thức H - T - H và T - H - T' là:", "a": "Công thức T-H-T' có điểm xuất phát và kết thúc đều là hàng hóa, còn H-T-H có điểm xuất phát và kết thúc là tiền", "note": "Phân biệt lưu thông hàng hóa giản đơn và tư bản.", "d": ["Mục đích của H-T-H là giá trị sử dụng, còn mục đích của T-H-T' là giá trị lớn hơn (giá trị thặng dư)", "H-T-H bắt đầu bằng hàng hóa và kết thúc bằng hàng hóa, còn T-H-T' bắt đầu và kết thúc bằng tiền", "Trong T-H-T', số tiền thu về lớn hơn số tiền ứng ra (T'=T+m), còn H-T-H thì không có giới hạn tăng thêm về giá trị"]}, {"n": 43, "p": 1, "q": "Chọn phương án đúng nhất: Sản xuất hàng hóa tư bản chủ nghĩa là:", "a": "Nền sản xuất dựa trên chế độ chiếm hữu tư nhân tư bản chủ nghĩa về tư liệu sản xuất và bóc lột lao động làm thuê", "note": "Bản chất bóc lột của CNTB.", "d": ["Nền sản xuất dựa trên chế độ công hữu về tư liệu sản xuất và phân phối theo lao động", "Nền sản xuất dựa trên chế độ tư hữu nhỏ về tư liệu sản xuất và lao động của chính người sản xuất", "Nền sản xuất dựa trên chế độ chiếm hữu phong kiến về ruộng đất và bóc lột địa tô"]}, {"n": 44, "p": 1, "q": "Chọn phương án đúng nhất về: Các biện pháp chủ yếu để tích lũy nguyên thủy?", "a": "Dùng bạo lực tước đoạt ruộng đất của nông dân, cướp bóc thuộc địa và buôn bán nô lệ", "note": "Phương thức bạo lực lịch sử.", "d": ["Dùng bạo lực tước đoạt ruộng đất của địa chủ, mở rộng thương mại tự do và phát triển thủ công nghiệp", "Tích lũy dần từ lợi nhuận của các cơ sở thủ công nghiệp và lao động tiết kiệm của người sản xuất nhỏ", "Vay vốn của các ngân hàng nhà nước và đầu tư vào công nghiệp chế tạo"]}, {"n": 45, "p": 1, "q": "Chọn phương án đúng: Sức lao động trở thành hàng hóa phổ biến từ khi nào?", "a": "Từ khi phương thức sản xuất tư bản chủ nghĩa ra đời và phát triển", "note": "Gắn liền với thị trường TBCN.", "d": ["Từ khi chế độ chiếm hữu nô lệ ra đời và phát triển", "Từ khi sản xuất hàng hóa giản đơn ra đời và phát triển", "Từ khi chế độ phong kiến ra đời và phát triển"]}, {"n": 46, "p": 1, "q": "Chọn phương án đúng về định nghĩa: Sức lao động?", "a": "Toàn bộ các năng lực thể chất và tinh thần tồn tại trong cơ thể, trong một con người đang sống, được người đó đem ra vận dụng mỗi khi sản xuất ra một giá trị sử dụng nào đó", "note": "Tiềm năng lao động.", "d": ["Toàn bộ khả năng lao động bằng chân tay của con người, được thể hiện qua kết quả sản phẩm làm ra", "Sự tiêu dùng năng lực thể chất và tinh thần của người lao động trong quá trình sản xuất ra giá trị sử dụng", "Toàn bộ các năng lực thể chất và tinh thần của người lao động được nhà tư bản mua và sở hữu vĩnh viễn"]}, {"n": 47, "p": 1, "q": "Khi so sánh sức lao động và lao động ý kiến nào sau đây không đúng?", "a": "Đồng nhất sức lao động với lao động", "note": "Sức lao động là tiềm năng, lao động là quá trình tiêu dùng.", "d": ["Sức lao động là khả năng lao động, còn lao động là sự tiêu dùng sức lao động trong thực tế", "Sức lao động là hàng hóa, còn lao động không phải là hàng hóa", "Sức lao động quyết định tiền lương, còn lao động tạo ra giá trị mới"]}, {"n": 48, "p": 1, "q": "Sự khác biệt lớn nhất (đặc điểm đặc biệt) về giá trị sử dụng của hàng hóa sức lao động so với các hàng hóa thông thường khác là gì?", "a": "Khi sử dụng, nó có khả năng tạo ra một lượng giá trị mới lớn hơn giá trị của bản thân nó (tạo ra giá trị thặng dư)", "note": "Chìa khóa giải quyết mâu thuẫn công thức chung.", "d": ["Khi sử dụng, nó chuyển toàn bộ giá trị của bản thân vào sản phẩm mới theo từng phần", "Khi sử dụng, nó tạo ra giá trị sử dụng thỏa mãn nhu cầu tiêu dùng cá nhân của công nhân", "Khi sử dụng, nó tạo ra lượng giá trị bằng đúng giá trị của bản thân nó (trao đổi ngang giá)"]}, {"n": 49, "p": 1, "q": "Lượng giá trị của hàng hóa sức lao động được đo lường gián tiếp thông qua yếu tố nào dưới đây?", "a": "Giá trị các tư liệu sinh hoạt cần thiết để tái sản xuất sức lao động (cho người lao động và gia đình họ) cộng với chi phí đào tạo", "note": "Cấu thành giá trị sức lao động.", "d": ["Giá trị các tư liệu sản xuất cần thiết cho người lao động trong quá trình làm việc, cộng với chi phí đào tạo", "Giá trị các tư liệu sinh hoạt cần thiết cho bản thân người lao động (không gồm gia đình họ) cộng với chi phí đào tạo", "Giá trị thặng dư mà người lao động tạo ra trong ngày lao động cộng với chi phí đào tạo"]}, {"n": 50, "p": 1, "q": "Xét về bản chất kinh tế học Mác - Lênin, điểm đặc thù nhất trong giá trị sử dụng của hàng hóa sức lao động được thể hiện như thế nào trong quá trình sản xuất?", "a": "Quá trình tiêu dùng sức lao động chính là quá trình tạo ra giá trị thặng dư (chìa khóa giải quyết mâu thuẫn công thức chung của tư bản)", "note": "Bản chất sinh ra m.", "d": ["Quá trình tiêu dùng sức lao động chỉ chuyển giá trị của tư liệu sản xuất vào sản phẩm (nguyên tắc trao đổi ngang giá)", "Quá trình tiêu dùng sức lao động tạo ra giá trị bằng đúng tiền lương nhà tư bản trả (chìa khóa giải quyết mâu thuẫn công thức chung)", "Quá trình tiêu dùng sức lao động làm tăng giá cả hàng hóa nhờ lưu thông (chìa khóa giải quyết mâu thuẫn công thức chung)"]}, {"n": 51, "p": 1, "q": "Nhận định nào dưới đây không đúng về hàng hóa sức lao động?", "a": "Hàng hóa sức lao động có giá trị sử dụng đặc biệt vì khi sử dụng nó tạo ra lượng giá trị nhỏ hơn giá trị của bản thân nó", "note": "Câu hỏi tùy biến đáp án theo đề thi.", "d": ["Giá trị sử dụng của hàng hóa sức lao động là nguồn gốc tạo ra giá trị thặng dư", "Sức lao động chỉ trở thành hàng hóa khi người lao động tự do về thân thể và bị tước đoạt tư liệu sản xuất", "Giá trị của hàng hóa sức lao động do giá trị các tư liệu sinh hoạt cần thiết để tái sản xuất ra nó quyết định"]}, {"n": 52, "p": 1, "q": "Chọn phương án đúng: Điều kiện để sức lao động trở thành hàng hoá là:", "a": "Người lao động được tự do về thân thể và bị tước đoạt hết tư liệu sản xuất", "note": "2 điều kiện lịch sử kiên quyết.", "d": ["Người lao động được tự do về thân thể và sở hữu đầy đủ tư liệu sản xuất", "Người lao động bị lệ thuộc thân thể vào chủ và bị tước đoạt hết tư liệu sản xuất", "Người lao động có thu nhập thấp và bị Nhà nước quy định nơi làm việc"]}, {"n": 53, "p": 1, "q": "Chọn phương án đúng: Nếu nhà tư bản trả công theo đúng giá trị sức lao động thì có còn bóc lột giá trị thặng dư không?", "a": "Vẫn còn bóc lột giá trị thặng dư (vì giá trị sử dụng của sức lao động tạo ra lượng giá trị lớn hơn giá trị bản thân nó)", "note": "Bản chất bóc lột ẩn giấu.", "d": ["Không còn bóc lột giá trị thặng dư (vì nhà tư bản đã trao đổi ngang giá theo giá trị sức lao động)", "Không còn bóc lột giá trị thặng dư (vì tiền công đã bù đắp toàn bộ giá trị mà công nhân tạo ra)", "Còn bóc lột giá trị thặng dư (vì nhà tư bản bán hàng hóa cao hơn giá trị của nó trong lưu thông)"]}, {"n": 54, "p": 1, "q": "Chọn phương án đúng về: Công thức chung của tư bản:", "a": "T-H-T' (với T'=T+m)", "note": "Vận động vì giá trị thặng dư.", "d": ["H-T-H' (với H'=H+m)", "T-H-T (với T'=T)", "H-T-H (với giá trị sử dụng khác nhau)"]}, {"n": 55, "p": 1, "q": "Chọn phương án đúng: Giá trị thặng dư là?", "a": "Phần giá trị mới dôi ra ngoài giá trị sức lao động do công nhân làm thuê tạo ra, bị nhà tư bản chiếm đoạt không bồi hoàn", "note": "Bản chất thu nhập của tư bản.", "d": ["Phần giá trị mới do công nhân tạo ra tương ứng với giá trị sức lao động, được nhà tư bản trả dưới hình thức tiền lương", "Phần giá trị dôi ra ngoài giá trị tư liệu sản xuất do máy móc, thiết bị tạo ra, thuộc sở hữu nhà tư bản", "Phần chênh lệch giữa giá bán và giá mua hàng hóa do nhà tư bản tạo ra trong lưu thông"]}, {"n": 56, "p": 1, "q": "Phương pháp sản xuất giá trị thặng dư tương đối được thực hiện bằng cách nào?", "a": "Tăng năng suất lao động xã hội nhằm rút ngắn thời gian lao động tất yếu, qua đó kéo dài thời gian lao động thặng dư khi độ dài ngày lao động không đổi", "note": "Dựa trên tăng NSLĐ xã hội.", "d": ["Kéo dài ngày lao động vượt giới hạn thời gian lao động tất yếu, trong khi năng suất lao động xã hội không đổi", "Tăng cường độ lao động của công nhân nhằm kéo dài thời gian lao động thặng dư khi độ dài ngày lao động không đổi", "Hạ thấp tiền công xuống dưới giá trị sức lao động để tăng thời gian lao động thặng dư khi ngày lao động không đổi"]}, {"n": 57, "p": 1, "q": "Tư bản khả biến (v) đóng vai trò như thế nào trong quá trình sản xuất ra giá trị thặng dư?", "a": "Là bộ phận tư bản lớn lên, là nguồn gốc trực tiếp tạo ra giá trị thặng dư", "note": "Nguồn gốc sinh ra m.", "d": ["Là bộ phận tư bản chỉ chuyển dần giá trị của nó vào sản phẩm, là điều kiện để tạo ra giá trị thặng dư", "Là bộ phận tư bản dùng để mua tư liệu sản xuất, giá trị của nó được bảo tồn và chuyển vào sản phẩm", "Là bộ phận tư bản không thay đổi về lượng, là nguồn gián tiếp tạo ra giá trị thặng dư"]}, {"n": 58, "p": 1, "q": "Chọn phương án đúng nhất: Điều kiện để tiền biến thành tư bản:", "a": "Tiền phải mua được hàng hóa sức lao động và đưa vào lưu thông để sinh ra giá trị thặng dư", "note": "Chuyển hóa tư bản thành công.", "d": ["Tiền phải được cất trữ và tích lũy đủ lớn để mua hàng hóa tư liệu sản xuất", "Tiền phải được Nhà nước bảo đảm và đưa vào lưu thông với hàng hóa thông thường", "Tiền phải mua được hàng hóa thông thường và bán lại với giá cao hơn nhờ chênh lệch trong lưu thông"]}, {"n": 59, "p": 1, "q": "Chọn phương án đúng: Ngày lao động của công nhân gồm những phần nào?", "a": "Thời gian lao động tất yếu và Thời gian lao động thặng dư", "note": "Cấu trúc ngày làm việc.", "d": ["Thời gian lao động cần thiết và Thời gian lao động giản đơn", "Thời gian lao động cá biệt và Thời gian lao động xã hội", "Thời gian lao động tất yếu và Thời gian nghỉ ngơi"]}, {"n": 60, "p": 1, "q": "Chọn phương án đúng khi Mác phân chia: Tư bản bất biến (C) và Tư bản khả biến (V) với mục đích chỉ rõ:", "a": "Nguồn gốc thực sự của giá trị thặng dư (chỉ có v mới tạo ra m)", "note": "Vạch trần bóc lột.", "d": ["Nguồn gốc thực sự của giá trị thặng dư (chỉ có c mới tạo ra m)", "Mức độ chuyển giá trị của từng bộ phận tư bản vào sản phẩm (c và v đều tạo ra m)", "Tốc độ chu chuyển của tư bản trong quá trình sản xuất (chỉ có v luân chuyển được)"]}, {"n": 61, "p": 1, "q": "Chọn phương án đúng về khái niệm tư bản:", "a": "Là giá trị mang lại giá trị thặng dư bằng cách bóc lột công nhân làm thuê", "note": "Phạm trù lịch sử.", "d": ["Là giá trị mang lại giá trị thặng dư bằng cách trao đổi ngang giá trong lưu thông", "Là tiền tệ được cất trữ để mua tư liệu sản xuất phục vụ nhu cầu tiêu dùng", "Là toàn bộ máy móc, nhà xưởng và nguyên vật liệu của người sản xuất"]}, {"n": 62, "p": 1, "q": "Chọn phương sai: Trong công thức tính giá trị hàng hoá là: c+v+m.", "a": "c là giá trị mới do lao động sống của công nhân tạo ra trong quá trình sản xuất", "note": "Công thức tổng giá trị W=c+v+m.", "d": ["c là giá trị của tư liệu sản xuất được chuyển vào sản phẩm (lao động quá khứ)", "v + m là giá trị mới do lao động sống của công nhân làm thuê tạo ra", "m là phần giá trị mới dôi ra ngoài giá trị sức lao động, do công nhân làm thuê tạo ra"]}, {"n": 63, "p": 1, "q": "Trong điều kiện độ dài ngày lao động được cố định bởi luật pháp (ví dụ: 8 giờ/ngày), để chuyển trọng tâm bóc lột sang phương pháp sản xuất giá trị thặng dư tương đối, nền kinh tế tư bản chủ nghĩa bắt buộc phải thỏa mãn tiền đề vĩ mô nào dưới đây?", "a": "Tăng năng suất lao động xã hội trong ngành sản xuất tư liệu sinh hoạt", "note": "Tiền đề sản xuất m tương đối.", "d": ["Tăng năng suất lao động cá biệt trong từng doanh nghiệp tiên tiến", "Tăng cường độ lao động trong ngành sản xuất tư liệu sinh hoạt", "Tăng năng suất lao động xã hội trong ngành sản xuất tư liệu sản xuất"]}, {"n": 64, "p": 1, "q": "Một nhà tư bản cá biệt đi tiên phong trong việc áp dụng dây chuyền công nghệ mới, làm năng suất lao động trong nhà máy của ông ta tăng gấp đôi so với mặt bằng chung. Nhờ đó, ông ta thu được một phần giá trị thặng dư dôi ra. Xét về bản chất kinh tế học Mác - Lênin, phần giá trị thặng dư dôi ra này là gì?", "a": "Giá trị thặng dư siêu ngạch (hình thái biến tướng của giá trị thặng dư tương đối)", "note": "Dựa trên NSLĐ cá biệt cao.", "d": ["Giá trị thặng dư tuyệt đối (do kéo dài ngày lao động)", "Giá trị thặng dư tương đối (do tăng năng suất lao động xã hội)", "Lợi nhuận bình quân (do cạnh tranh giữa các ngành)"]}, {"n": 65, "p": 1, "q": "Chọn phương án đúng: Căn cứ để phân chia tư bản thành tư bản bất biến (C) và tư bản khả biến (v):", "a": "Dựa vào vai trò của từng bộ phận tư bản trong quá trình tạo ra giá trị thặng dư", "note": "Vai trò tạo giá trị mới.", "d": ["Dựa vào phương thức chuyển giá trị của từng bộ phận tư bản vào sản phẩm trong quá trình sản xuất", "Dựa vào hình thái vật chất của từng bộ phận tư bản là tư liệu sản xuất hay sức lao động", "Dựa vào tốc độ chu chuyển của từng bộ phận tư bản trong quá trình sản xuất"]}, {"n": 66, "p": 1, "q": "Chọn phương án đúng nhất: Điểm đặc biệt căn bản của hàng hóa sức lao động so với hàng hóa thông thường là:", "a": "Khi sử dụng, nó tạo ra lượng giá trị lớn hơn giá trị của bản thân nó", "note": "Năng lực sinh ra giá trị thặng dư.", "d": ["Khi sử dụng, nó chuyển dần giá trị của bản thân vào sản phẩm theo mức độ hao mòn", "Khi sử dụng, nó chỉ tạo ra giá trị sử dụng mà không tạo ra thêm giá trị mới", "Khi sử dụng, nó tạo ra lượng giá trị bằng đúng giá trị của bản thân nó"]}, {"n": 67, "p": 1, "q": "Chọn phương án đúng về giá trị thặng dư tuyệt đối và giá trị thặng dư tương đối:", "a": "Tuyệt đối kéo dài ngày lao động; Tương đối rút ngắn thời gian lao động tất yếu bằng cách tăng năng suất lao động xã hội", "note": "Hai phương pháp bóc lột cơ bản.", "d": ["Tuyệt đối rút ngắn thời gian lao động tất yếu; Tương đối kéo dài ngày lao động bằng cách tăng cường độ lao động", "Tuyệt đối tăng năng suất lao động xã hội; Tương đối kéo dài ngày lao động trong giới hạn pháp luật", "Tuyệt đối kéo dài ngày lao động; Tương đối hạ thấp tiền công xuống dưới giá trị sức lao động"]}, {"n": 68, "p": 1, "q": "Một doanh nghiệp áp dụng AI mới, làm cho giá trị cá biệt của hàng hóa thấp hơn giá trị thị trường trong khi giá thị trường chưa thay đổi. Khoản thu nhập vượt trội là gì?", "a": "Giá trị thặng dư siêu ngạch", "note": "Thành quả đổi mới công nghệ.", "d": ["Giá trị thặng dư tuyệt đối", "Giá trị thặng dư tương đối", "Lợi nhuận độc quyền"]}, {"n": 69, "p": 1, "q": "Chọn phương án không đúng về tích lũy tư bản:", "a": "Tích lũy tư bản là quá trình tái sản xuất giản đơn, trong đó toàn bộ giá trị thặng dư được dùng cho tiêu dùng cá nhân của nhà tư bản", "note": "Bản chất là tái sản xuất mở rộng.", "d": ["Tích lũy tư bản là quá trình tái sản xuất mở rộng tư bản chủ nghĩa", "Tích lũy tư bản là sự chuyển hóa một phần giá trị thặng dư thành tư bản phụ thêm", "Nguồn gốc duy nhất của tư bản tích lũy là giá trị thặng dư do công nhân làm thuê tạo ra"]}, {"n": 70, "p": 1, "q": "Chọn phương án đúng: Đâu là nguồn gốc của tích luỹ tư bản?", "a": "Giá trị thặng dư (m)", "note": "Nguồn gốc duy nhất từ m.", "d": ["Tư bản ứng trước (K)", "Tiền vốn vay từ ngân hàng (tín dụng)", "Quá trình tích lũy nguyên thủy (T)"]}, {"n": 71, "p": 1, "q": "Chọn phương án sai về: Nhân tố quyết định đến quy mô tích luỹ tư bản?", "a": "Tốc độ lưu thông tiền tệ trong nền kinh tế", "note": "Nắm vững các nhân tố quyết định quy mô tích lũy.", "d": ["Trình độ bóc lột sức lao động (tỷ suất giá trị thặng dư)", "Năng suất lao động xã hội", "Quy mô của tư bản ứng trước"]}, {"n": 72, "p": 1, "q": "Chọn phương án sai về: Sự thể hiện các quy luật phổ biến của tích lũy tư bản bao gồm:", "a": "Cấu tạo hữu cơ c/v ngày càng giảm xuống, làm tăng nhu cầu về lao động sống", "note": "Hệ quả tất yếu của tích lũy.", "d": ["Cấu tạo hữu cơ của tư bản (c/v) ngày càng tăng lên", "Xuất hiện đội quân lao động dôi thừa tương đối, thất nghiệp gia tăng", "Sự bần cùng hóa giai cấp công nhân (tương đối và tuyệt đối)"]}, {"n": 73, "p": 1, "q": "Theo Các Mác, thực chất của quá trình tích lũy tư bản là gì?", "a": "Quá trình tái sản xuất mở rộng tư bản chủ nghĩa bằng cách chuyển hóa một phần giá trị thặng dư thành tư bản phụ thêm", "note": "Tái sản xuất mở rộng TBCN.", "d": ["Quá trình tái sản xuất giản đơn tư bản chủ nghĩa bằng cách chuyển hóa toàn bộ giá trị thặng dư thành tiêu dùng cá nhân", "Quá trình tái sản xuất mở rộng tư bản chủ nghĩa bằng cách đầu tư thêm tư bản ứng trước từ nguồn vay ngân hàng", "Quá trình tái sản xuất mở rộng tư bản chủ nghĩa bằng cách chuyển hóa một phần tiền công thành tư bản phụ thêm"]}, {"n": 74, "p": 1, "q": "Về mặt tác động đến quy mô tư bản, điểm khác biệt căn bản nhất giữa tích tụ tư bản và tập trung tư bản là gì?", "a": "Tích tụ làm tăng quy mô tư bản xã hội (dựa trên tích lũy m); Tập trung chỉ làm tăng quy mô tư bản cá biệt (thông qua sáp nhập, thâu tóm các tư bản có sẵn)", "note": "Tích tụ tăng tư bản xã hội, tập trung tăng tư bản cá biệt.", "d": ["Tích tụ làm tăng quy mô tư bản cá biệt (dựa trên sáp nhập); Tập trung làm tăng quy mô tư bản xã hội (dựa trên tích lũy m)", "Tích tụ và tập trung đều làm tăng quy mô tư bản xã hội (thông qua tích lũy m và vay mượn tín dụng)", "Tích tụ và tập trung đều chỉ làm tăng quy mô tư bản cá biệt (thông qua sáp nhập, thâu tóm các tư bản có sẵn)"]}, {"n": 75, "p": 1, "q": "Theo Các Mác, định nghĩa chính xác nhất về \"cấu tạo hữu cơ của tư bản\" (ký hiệu là c/v) là gì?", "a": "Cấu tạo giá trị của tư bản do cấu tạo kỹ thuật của tư bản quyết định và phản ánh sự biến đổi của cấu tạo kỹ thuật đó (c/v)", "note": "Tỷ lệ tư bản bất biến trên khả biến.", "d": ["Cấu tạo giá trị của tư bản do cấu tạo kỹ thuật quyết định, phản ánh tỷ lệ giữa m và v (m/v)", "Cấu tạo kỹ thuật của tư bản phản ánh tỷ lệ giữa khối lượng tư liệu sản xuất và sức lao động (c/v)", "Cấu tạo giá trị của tư bản do tốc độ chu chuyển quyết định và phản ánh tỷ lệ giữa c và m (c/m)"]}, {"n": 76, "p": 1, "q": "Cùng với sự phát triển của chủ nghĩa tư bản và tiến bộ khoa học - công nghệ, cấu tạo hữu cơ của tư bản (c/v) có xu hướng biến đổi như thế nào?", "a": "Có xu hướng ngày càng tăng lên", "note": "Xu hướng tất yếu của tiến bộ KH-KT.", "d": ["Có xu hướng ngày càng giảm xuống", "Có xu hướng không đổi trong dài hạn", "Có xu hướng tăng lên rồi giảm xuống theo chu kỳ"]}, {"n": 77, "p": 1, "q": "Hệ quả trực tiếp của xu hướng tăng cấu tạo hữu cơ của tư bản đối với việc làm của giai cấp công nhân là gì?", "a": "Tạo ra đội quân lao động dôi thừa tương đối (nạn thất nghiệp)", "note": "Gây ra thất nghiệp trong CNTB.", "d": ["Làm tăng nhu cầu về lao động sống, tạo thêm nhiều việc làm cho công nhân", "Làm giảm thất nghiệp nhờ năng suất lao động tăng và thị trường tiêu thụ mở rộng", "Làm tăng tiền lương thực tế của công nhân nhờ giá trị sức lao động tăng"]}, {"n": 78, "p": 1, "q": "Hình thức nào không phải biểu hiện giá trị thặng dư?", "a": "Tiền lương (Tiền công của công nhân)", "note": "Tiền lương là giá cả sức lao động, không phải m.", "d": ["Lợi nhuận (của nhà tư bản công nghiệp)", "Lợi tức (của nhà tư bản cho vay)", "Địa tô (của chủ đất tư bản chủ nghĩa)"]}, {"n": 79, "p": 1, "q": "Chọn ý sai về vai trò của tư bản bất biến (C) và tư bản khả biến (v):", "a": "Cho rằng tư bản bất biến (c) cũng có khả năng tạo ra giá trị thặng dư", "note": "c không sinh ra giá trị mới.", "d": ["Tư bản bất biến là bộ phận tư bản tồn tại dưới hình thái tư liệu sản xuất, giá trị được bảo tồn và chuyển vào sản phẩm", "Tư bản khả biến là bộ phận tư bản dùng để mua sức lao động, giá trị của nó tăng lên trong quá trình sản xuất", "Tư bản khả biến là nguồn gốc trực tiếp tạo ra giá trị thặng dư, còn tư bản bất biến là điều kiện cần thiết của quá trình đó"]}, {"n": 80, "p": 1, "q": "Chọn phương án đúng về: Khối lượng giá trị thặng dư (M):", "a": "Phản ánh quy mô bóc lột của nhà tư bản (M=m'×V)", "note": "Tổng lượng giá trị thặng dư.", "d": ["Phản ánh trình độ bóc lột của nhà tư bản đối với công nhân (M=m/v)", "Là tỷ lệ phần trăm giữa giá trị thặng dư và tư bản bất biến (M=m/c×100%)", "Phản ánh hiệu quả sử dụng toàn bộ tư bản ứng trước (M=m/(c+v))"]}, {"n": 81, "p": 1, "q": "Chọn ý sai về: Tỷ suất giá trị thặng dư (m') phản ánh:", "a": "Phản ánh quy mô bóc lột (Thực tế m' chỉ phản ánh trình độ hoặc mức độ bóc lột)", "note": "m' phản ánh trình độ, M phản ánh quy mô.", "d": ["Phản ánh trình độ bóc lột sức lao động của nhà tư bản đối với công nhân làm thuê", "Được tính bằng tỷ lệ phần trăm giữa m và v (m' = m/v × 100%)", "Cho biết trong ngày lao động, thời gian lao động thặng dư chiếm bao nhiêu so với thời gian lao động tất yếu"]}, {"n": 82, "p": 1, "q": "Chi phí sản xuất tư bản chủ nghĩa (k) bao gồm những yếu tố nào dưới đây?", "a": "K=c+v (Chi phí tư bản bất biến và tư bản khả biến)", "note": "Chi phí thực tế của nhà tư bản.", "d": ["K=v+m (chi phí tư bản khả biến và giá trị thặng dư)", "K=c+m (chi phí tư bản bất biến và giá trị thặng dư)", "K=c+v+m (toàn bộ giá trị của hàng hóa)"]}, {"n": 83, "p": 1, "q": "Xét về mặt bản chất kinh tế chính trị, sự xuất hiện của phạm trù \"chi phí sản xuất tư bản chủ nghĩa\" (k) gây ra hệ quả (ảo giác) gì trong xã hội tư bản?", "a": "Che giấu bản chất bóc lột, làm cho người ta tưởng lầm rằng lợi nhuận sinh ra từ toàn bộ tư bản ứng trước (c+v)", "note": "Tạo ảo tưởng che giấu bóc lột.", "d": ["Làm lộ rõ nguồn gốc giá trị thặng dư là lao động không công của công nhân làm thuê", "Làm cho công nhân thấy mình được trả công đầy đủ vì lợi nhuận được chia đều cho cả tư bản và lao động", "Làm cho người ta nhận thức đúng rằng chỉ có tư bản khả biến mới sinh ra giá trị thặng dư"]}, {"n": 84, "p": 1, "q": "Xét về bản chất, mối quan hệ giữa lợi nhuận (p) và giá trị thặng dư (m) được thể hiện chính xác nhất qua nhận định nào dưới đây?", "a": "Lợi nhuận là hình thái biến tướng của giá trị thặng dư, xét về bản chất chúng là một", "note": "p và m về bản chất là một.", "d": ["Lợi nhuận và giá trị thặng dư khác nhau về chất: lợi nhuận do lưu thông tạo ra, còn giá trị thặng dư do sản xuất tạo ra", "Lợi nhuận luôn lớn hơn giá trị thặng dư vì được tính trên toàn bộ tư bản ứng trước", "Lợi nhuận là phần giá trị mới do tư bản bất biến tạo ra, còn giá trị thặng dư do tư bản khả biến tạo ra"]}, {"n": 85, "p": 1, "q": "Về mặt chất và mặt lượng, sự khác biệt căn bản giữa tỷ suất lợi nhuận (p') và tỷ suất giá trị thặng dư (m') là gì?", "a": "P' tính trên toàn bộ tư bản ứng trước (m/(c+v)), còn m' tính trên tư bản khả biến (m/v), do đó p' luôn nhỏ hơn m'", "note": "p'<m' luôn đúng.", "d": ["P' tính trên tư bản khả biến (m/v), còn m' tính trên toàn bộ tư bản ứng trước, do đó p' luôn lớn hơn m'", "P' phản ánh mức độ bóc lột sức lao động, còn m' phản ánh hiệu quả sử dụng tư bản; hai tỷ suất luôn bằng nhau", "P' và m' có cùng công thức tính và chỉ khác nhau về đơn vị tiền tệ biểu hiện"]}, {"n": 86, "p": 1, "q": "Chọn phương án đúng về tỷ suất lợi nhuận và tỷ suất giá trị thặng dư:", "a": "P' luôn nhỏ hơn m' vì mẫu số của p' lớn hơn (c+v>v)", "note": "Hệ quả từ mẫu số tính toán.", "d": ["P' luôn lớn hơn m' vì lợi nhuận lớn hơn giá trị thặng dư", "P' luôn bằng m' vì lợi nhuận và giá trị thặng dư về bản chất là một", "P' có thể lớn hơn hoặc nhỏ hơn m' tùy theo cấu tạo hữu cơ của tư bản"]}, {"n": 87, "p": 1, "q": "Trong nền sản xuất lớn hiện đại, yếu tố nào giữ vai trò quyết định của quá trình lao động sản xuất?", "a": "Khoa học, công nghệ và người lao động có trình độ tri thức cao", "note": "LLSX hiện đại.", "d": ["Máy móc, thiết bị và tư liệu sản xuất vật chất", "Quy mô vốn tiền tệ của nhà tư bản", "Số lượng lao động chân tay giản đơn"]}, {"n": 88, "p": 1, "q": "Chọn phương án đúng: Để tăng khối lượng giá trị thặng dư (M) nhà tư bản có thể sử dụng cách nào sau đây:", "a": "Tăng tỷ suất giá trị thặng dư (m') hoặc tăng quy mô tư bản khả biến ứng trước (V)", "note": "Biện pháp tăng khối lượng m.", "d": ["Tăng tư bản bất biến (c) và giảm tư bản khả biến (v) ứng trước", "Giảm tỷ suất giá trị thặng dư (m') và tăng quy mô tư bản bất biến (c)", "Giảm số công nhân làm thuê và kéo dài thời gian nghỉ ngơi trong ngày"]}, {"n": 89, "p": 1, "q": "Chọn phương án đúng về: Vai trò của tỷ suất lợi nhuận:", "a": "Là động lực cạnh tranh và là đòn bẩy điều tiết tư bản dịch chuyển giữa các ngành sản xuất", "note": "Đòn bẩy di chuyển dòng vốn.", "d": ["Là cơ sở để Nhà nước ấn định giá cả sản xuất bằng mệnh lệnh hành chính", "Là thước đo trực tiếp mức độ bóc lột lao động của nhà tư bản", "Là yếu tố làm giảm cạnh tranh và cố định tư bản trong từng ngành sản xuất"]}, {"n": 90, "p": 1, "q": "Chọn phương án sai về: Nhân tố nào không ảnh hưởng đến tỷ suất lợi nhuận:", "a": "Giá trị sử dụng cụ thể của hàng hóa được sản xuất ra", "note": "Loại trừ phương án sai.", "d": ["Tỷ suất giá trị thặng dư (m')", "Cấu tạo hữu cơ của tư bản (c/v)", "Tốc độ chu chuyển của tư bản"]}, {"n": 91, "p": 1, "q": "Chọn phương sai: Kết quả cạnh tranh giữa các ngành dẫn tới hình thành:", "a": "Lợi nhuận cá biệt bằng nhau ở mọi doanh nghiệp", "note": "Cạnh tranh giữa các ngành hình thành lợi nhuận bình quân.", "d": ["Tỷ suất lợi nhuận bình quân", "Lợi nhuận bình quân", "Giá cả sản xuất"]}, {"n": 92, "p": 1, "q": "Chọn phương án sai trong các nội dung sau đây về giá cả sản xuất:", "a": "Giá cả sản xuất bằng chi phí sản xuất cộng với giá trị thặng dư (GCSX = k + m)", "note": "Công thức chuẩn: GCSX=k+p.", "d": ["Giá cả sản xuất bằng chi phí sản xuất cộng với lợi nhuận bình quân (GCSX = k + p̄)", "Giá cả thị trường lên xuống xoay quanh giá cả sản xuất", "Giá cả sản xuất là hình thái biến tướng của giá trị trong cạnh tranh giữa các ngành"]}, {"n": 93, "p": 1, "q": "Chọn phương án đúng về: Công thức tính giá cả sản xuất (GCSX):", "a": "GCSX=k+p (Chi phí sản xuất tư bản chủ nghĩa cộng với lợi nhuận bình quân)", "note": "Công thức giá cả sản xuất.", "d": ["GCSX=k+m (chi phí sản xuất cộng với giá trị thặng dư)", "GCSX=c+v+m (giá trị hàng hóa)", "GCSX=k+p cá biệt (chi phí sản xuất cộng với lợi nhuận cá biệt)"]}, {"n": 94, "p": 1, "q": "Chọn phương án đúng về: Nguồn gốc lợi nhuận của tư bản thương nghiệp:", "a": "Là một phần giá trị thặng dư do công nhân sản xuất ra trong lĩnh vực sản xuất, được nhà tư bản công nghiệp nhường lại thông qua chênh lệch giá bán buôn và giá bán lẻ", "note": "Tư bản thương nghiệp chia sẻ phần m.", "d": ["Là phần giá trị thặng dư do chính nhà tư bản thương nghiệp tạo ra thông qua hoạt động mua rẻ bán đắt", "Là phần giá trị mới do hoạt động mua rẻ bán đắt trong lưu thông tạo thêm cho hàng hóa", "Là phần lợi tức mà nhà tư bản cho vay chuyển lại cho nhà tư bản thương nghiệp"]}, {"n": 95, "p": 2, "q": "Chọn phương án sai về các cặp phạm trù tư bản:", "a": "(Tùy phương án nhiễu về tư bản cố định - lưu động, sản xuất - lưu thông)", "note": "Nhận diện phạm trù tư bản.", "d": ["GCSX=k+p (Chi phí sản xuất tư bản chủ nghĩa cộng với lợi nhuận bình quân)", "Mục đích của vận động (tiêu dùng hay giá trị thặng dư) và điểm xuất phát, kết thúc của tư bản", "Tăng tỷ suất giá trị thặng dư (m') hoặc tăng quy mô tư bản khả biến ứng trước (V)"]}, {"n": 96, "p": 2, "q": "Chọn phương án sai về: Đặc điểm của tư bản cho vay trong chủ nghĩa tư bản:", "a": "(Đặc điểm đúng: quyền sở hữu tách rời quyền sử dụng, là hàng hóa đặc biệt, sùng bái nhất)", "note": "Đặc điểm tư bản cho vay.", "d": ["Công nghiệp hóa, hiện đại hóa (xây dựng cơ sở vật chất - kỹ thuật cho chủ nghĩa xã hội)", "Giá trị sử dụng là phạm trù vĩnh viễn; giá trị là phạm trù lịch sử (chỉ tồn tại trong kinh tế hàng hóa)", "Là phạm trù lịch sử, chỉ tồn tại trong nền sản xuất hàng hóa (là sự hao phí sức lao động nói chung của con người)"]}, {"n": 97, "p": 2, "q": "Lựa chọn phương án đúng: Tập trung tư bản có thể được thực hiện thông qua việc sáp nhập các tư bản nào với nhau?", "a": "Các tư bản cá biệt có sẵn trong xã hội lại với nhau", "note": "Khác với tích tụ tư bản.", "d": ["Các phần giá trị thặng dư được tư bản hóa của từng nhà tư bản riêng lẻ", "Chỉ các tư bản nhỏ của nông dân và thợ thủ công trong nước", "Các tư bản mới hình thành từ việc vay nợ của Nhà nước"]}, {"n": 98, "p": 2, "q": "Lợi nhuận thương nghiệp có được là do bán hàng hoá với mức giá:", "a": "Mua thấp hơn giá trị và bán bằng hoặc xoay quanh giá trị thực tế của hàng hóa", "note": "Chênh lệch giá mua - bán.", "d": ["Là bộ phận tư bản lớn lên, là nguồn gốc trực tiếp tạo ra giá trị thặng dư", "Người lao động được tự do về thân thể và bị tước đoạt hết tư liệu sản xuất", "Tiền phải mua được hàng hóa sức lao động và đưa vào lưu thông để sinh ra giá trị thặng dư"]}, {"n": 99, "p": 2, "q": "Nội dung nào trong các nhận định dưới đây không đúng về tư bản cho vay và tín dụng?", "a": "(Tùy phương án sai lệch về bản chất tín dụng tư bản chủ nghĩa)", "note": "Bản chất tín dụng tư bản.", "d": ["Nguồn gốc thực sự của giá trị thặng dư (chỉ có v mới tạo ra m)", "GCSX=k+p (Chi phí sản xuất tư bản chủ nghĩa cộng với lợi nhuận bình quân)", "Công nghiệp hóa, hiện đại hóa (xây dựng cơ sở vật chất - kỹ thuật cho chủ nghĩa xã hội)"]}, {"n": 100, "p": 2, "q": "Chọn phương án đúng khi nói về: Chủ nghĩa tư bản độc quyền:", "a": "Là giai đoạn phát triển cao của phương thức sản xuất tư bản chủ nghĩa (chuyển từ tự do cạnh tranh sang độc quyền từ cuối XIX - đầu XX)", "note": "Giai đoạn phát triển cao của CNTB.", "d": ["Giá trị các tư liệu sinh hoạt cần thiết để tái sản xuất sức lao động (cho người lao động và gia đình họ) cộng với chi phí đào tạo", "Là phạm trù lịch sử, chỉ tồn tại trong nền sản xuất hàng hóa (là sự hao phí sức lao động nói chung của con người)", "Giá trị sử dụng (tính hữu ích của vật thể), một vật có thể có nhiều giá trị sử dụng khác nhau do thuộc tính tự nhiên quy định"]}, {"n": 101, "p": 2, "q": "Chọn phương sai về: Đặc trưng kinh tế cơ bản của chủ nghĩa tư bản giai đoạn độc quyền:", "a": "(Đặc trưng sai hay gặp: Cho rằng xuất khẩu hàng hóa là chủ yếu thay vì xuất khẩu tư bản)", "note": "5 đặc điểm cơ bản của Lênin.", "d": ["Phân công lao động xã hội và sự tách biệt về mặt kinh tế (độc lập) giữa các chủ thể sản xuất", "Sở hữu tư bản độc quyền tư nhân (hoặc tư bản nước ngoài 100%)", "GCSX=k+p (Chi phí sản xuất tư bản chủ nghĩa cộng với lợi nhuận bình quân)"]}, {"n": 102, "p": 2, "q": "Chọn phương án sai về: Phương thức mà tư bản tài chính đã sử dụng để thực hiện sự thống trị của mình:", "a": "Dùng bạo lực quân sự trực tiếp để cưỡng bức các doanh nghiệp nhỏ phải phụ thuộc vào tư bản tài chính", "note": "Phương thức thống trị tài chính.", "d": ["Chế độ tham dự (một nhóm tư bản nắm cổ phiếu khống chế các công ty khác)", "Lập các công ty cổ phần để thu hút vốn và mở rộng chi phối", "Móc nối, liên kết chặt chẽ với bộ máy nhà nước để phục vụ lợi ích tư bản tài chính"]}, {"n": 103, "p": 2, "q": "Chọn phương án sai về: Biểu hiện mới của xuất khẩu tư bản ngày nay:", "a": "Xuất khẩu tư bản ngày nay chỉ diễn ra từ các nước phát triển sang các nước chậm phát triển, không còn dòng vốn giữa các nước phát triển với nhau", "note": "Xu hướng xuất khẩu tư bản hiện đại.", "d": ["Xuất khẩu tư bản giữa các nước phát triển với nhau ngày càng chiếm tỷ trọng lớn", "Hình thức xuất khẩu tư bản đa dạng: đầu tư trực tiếp, đầu tư gián tiếp, tín dụng quốc tế", "Một số nước đang phát triển cũng bắt đầu xuất khẩu tư bản ra nước ngoài"]}, {"n": 104, "p": 2, "q": "Nguyên nhân ra đời của CNTB độc quyền là:", "a": "Sự phát triển của lực lượng sản xuất và cạnh tranh tự do làm xuất hiện tập trung sản xuất đến một trình độ nhất định", "note": "Cạnh tranh tự do đẻ ra tập trung sản xuất.", "d": ["Sự can thiệp của Nhà nước nhằm hạn chế cạnh tranh tự do và bảo hộ các doanh nghiệp lớn", "Sự phát triển của thương mại quốc tế và sự xuất hiện của tiền tệ", "Sự xuất hiện của tín dụng ngân hàng làm phân tán sản xuất"]}, {"n": 105, "p": 2, "q": "Chọn phương án đúng nhất: Điểm nào giải thích trực tiếp nhất vì sao tích tụ và tập trung sản xuất đến một trình độ nhất định lại dẫn tới sự hình thành tổ chức độc quyền?", "a": "Do quy mô xí nghiệp quá lớn, cạnh tranh trở nên quá khốc liệt, các nhà tư bản thỏa hiệp với nhau để tránh thua lỗ và thao túng thị trường", "note": "Nguyên nhân hình thành tổ chức độc quyền.", "d": ["Do Nhà nước ban hành quy định buộc các xí nghiệp lớn phải sáp nhập", "Do cạnh tranh tự do biến mất hoàn toàn khi quy mô xí nghiệp tăng nên không cần thỏa hiệp", "Do nhu cầu tiêu dùng của xã hội giảm xuống nên các xí nghiệp phải liên kết với nhau"]}, {"n": 106, "p": 2, "q": "Chọn phương án không đúng về các nguyên nhân dẫn đến sự hình thành độc quyền cuối thế kỷ XIX - đầu thế kỷ XX:", "a": "(Tùy phương án nhiễu trái ngược quy luật tập trung sản xuất)", "note": "Nguyên nhân lịch sử độc quyền.", "d": ["Nguyên tắc phân phối theo lao động (trong chủ nghĩa xã hội)", "Sở hữu tư bản độc quyền tư nhân (hoặc tư bản nước ngoài 100%)", "Phản ánh quy mô bóc lột của nhà tư bản (M=m'×V)"]}, {"n": 107, "p": 2, "q": "Nhận định nào phản ánh đúng nhất mối quan hệ giữa cạnh tranh và độc quyền trong chủ nghĩa tư bản?", "a": "Độc quyền sinh ra từ cạnh tranh tự do, nhưng độc quyền không thủ tiêu cạnh tranh mà làm cho cạnh tranh trở nên gay gắt, đa dạng và khốc liệt hơn", "note": "Độc quyền không thủ tiêu cạnh tranh.", "d": ["Độc quyền thủ tiêu hoàn toàn cạnh tranh vì thị trường chỉ còn một nhà cung cấp", "Độc quyền và cạnh tranh loại trừ nhau, độc quyền chỉ xuất hiện khi cạnh tranh đã chấm dứt", "Độc quyền làm cạnh tranh yếu đi và ổn định giá cả vì các tổ chức độc quyền thỏa thuận với nhau"]}, {"n": 108, "p": 2, "q": "Chọn phương án không đúng về tư bản tài chính:", "a": "(Tùy phương án tách rời độc quyền ngân hàng và độc quyền công nghiệp)", "note": "Bản chất dung hợp tài chính.", "d": ["Sở hữu tư bản độc quyền tư nhân (hoặc tư bản nước ngoài 100%)", "Tăng tỷ suất giá trị thặng dư (m') hoặc tăng quy mô tư bản khả biến ứng trước (V)", "Tạo ra đội quân lao động dôi thừa tương đối (nạn thất nghiệp)"]}, {"n": 109, "p": 2, "q": "Chọn phương án đúng nhất: Một ngân hàng lớn nắm cổ phần chi phối ở công ty A; công ty A lại nắm cổ phần chi phối ở công ty B... Trường hợp này phản ánh rõ nhất:", "a": "Chế độ tham dự của tư bản tài chính", "note": "Khái niệm chế độ tham dự.", "d": ["Phương pháp trừu tượng hoá khoa học", "Chức năng phương tiện thanh toán", "Chế độ tư hữu về tư liệu sản xuất"]}, {"n": 110, "p": 2, "q": "Chọn phương án đúng về xuất khẩu tư bản, nhận định nào sau đây đúng?", "a": "Là xuất khẩu giá trị ra nước ngoài nhằm chiếm đoạt giá trị thặng dư và các nguồn lợi ích khác ở nước nhận đầu tư", "note": "Bản chất xuất khẩu tư bản.", "d": ["Là bộ phận tư bản lớn lên, là nguồn gốc trực tiếp tạo ra giá trị thặng dư", "Dựa vào vai trò của từng bộ phận tư bản trong quá trình tạo ra giá trị thặng dư", "Nền sản xuất dựa trên chế độ chiếm hữu tư nhân tư bản chủ nghĩa về tư liệu sản xuất và bóc lột lao động làm thuê"]}, {"n": 111, "p": 2, "q": "Chọn phương án không đúng: Một điểm khác biệt quan trọng giữa chủ nghĩa tư bản tự do cạnh tranh và chủ nghĩa tư bản độc quyền là:", "a": "Cho rằng độc quyền đã thủ tiêu hoàn toàn cạnh tranh", "note": "Sai lầm khi cho rằng độc quyền thủ tiêu cạnh tranh.", "d": ["Chủ nghĩa tư bản tự do cạnh tranh dựa vào các xí nghiệp nhỏ, còn chủ nghĩa tư bản độc quyền dựa vào các tổ chức độc quyền lớn", "Xuất khẩu tư bản có ý nghĩa đặc biệt quan trọng hơn xuất khẩu hàng hóa", "Tư bản tài chính hình thành và chi phối nền kinh tế, còn thời kỳ tự do cạnh tranh thì chưa có"]}, {"n": 112, "p": 2, "q": "Chọn phương án đúng nhất: Sự phân chia thị trường thế giới giữa các liên minh độc quyền không thể ổn định lâu dài chủ yếu vì:", "a": "Sự phát triển không đều về kinh tế và lực lượng giữa các nước tư bản luôn làm thay đổi tương quan lực lượng trên trường quốc tế", "note": "Quy luật phát triển không đều.", "d": ["Do sự can thiệp của các tổ chức quốc tế vào hoạt động của các liên minh độc quyền", "Do nhu cầu tiêu dùng của các nước thuộc địa giảm sút liên tục", "Do các liên minh độc quyền tự nguyện nhường thị trường cho các đối thủ nhỏ"]}, {"n": 113, "p": 2, "q": "Nội dung nào sau đây thể hiện đúng mối liên hệ giữa xuất khẩu tư bản và phân chia thế giới về kinh tế?", "a": "Xuất khẩu tư bản là công cụ chủ yếu thúc đẩy sự phân chia thế giới về kinh tế giữa các liên minh độc quyền quốc tế", "note": "Công cụ bành trướng quốc tế.", "d": ["Xuất khẩu tư bản làm giảm sự phân chia thế giới vì tư bản chuyển sang sản xuất trong nước", "Xuất khẩu tư bản chỉ phục vụ nhu cầu tiêu dùng của dân cư, không liên quan đến các liên minh độc quyền", "Phân chia thế giới về kinh tế diễn ra độc lập, hoàn toàn bằng thương mại hàng hóa giữa các nước"]}, {"n": 114, "p": 2, "q": "Trong các biểu hiện sau, đâu là biểu hiện mới của tích tụ và tập trung tư bản trong thời đại số?", "a": "Sự hình thành các tập đoàn công nghệ xuyên quốc gia (Big Tech) và hệ sinh thái nền tảng số với quy mô tư bản khổng lồ", "note": "Biểu hiện thời đại số 4.0.", "d": ["Chức năng phương tiện thanh toán và chức năng tiền tệ thế giới (có thể dùng tín dụng, bút tệ hoặc thanh toán quốc tế)", "Là phạm trù lịch sử, chỉ tồn tại trong nền sản xuất hàng hóa (là sự hao phí sức lao động nói chung của con người)", "Quá trình tiêu dùng sức lao động chính là quá trình tạo ra giá trị thặng dư (chìa khóa giải quyết mâu thuẫn công thức chung của tư bản)"]}, {"n": 115, "p": 3, "q": "Chọn phương án đúng nhất: Theo V.I.Lênin, điều kiện quá độ lên chủ nghĩa xã hội bỏ qua chế độ tư bản chủ nghĩa đối với các dân tộc lạc hậu là:", "a": "Phải có sự lãnh đạo của Đảng Cộng sản và sự giúp đỡ, ủng hộ của giai cấp vô sản ở các nước tiên tiến", "note": "Điều kiện của V.I. Lênin.", "d": ["Phải có chính quyền tư sản mạnh và sự giúp đỡ của các nước đế quốc", "Phải trải qua đầy đủ giai đoạn phát triển tư bản chủ nghĩa trước", "Phải có nền công nghiệp hiện đại hoàn chỉnh và thị trường thế giới rộng lớn"]}, {"n": 116, "p": 3, "q": "Chọn phương án đúng: Đảng ta khẳng định con đường đi lên của đất nước ta là:", "a": "Quá độ lên chủ nghĩa xã hội bỏ qua chế độ tư bản chủ nghĩa", "note": "Đường lối nhất quán của Đảng.", "d": ["Các tư bản cá biệt có sẵn trong xã hội lại với nhau", "Hao phí lao động cá biệt của từng người sản xuất quyết định", "Từ khi phương thức sản xuất tư bản chủ nghĩa ra đời và phát triển"]}, {"n": 117, "p": 3, "q": "Chọn phương án sai khi luận giải về: Khả năng khách quan của quá độ lên CNXH bỏ qua chế độ TBCN ở Việt Nam do:", "a": "Xu thế thời đại cho thấy chủ nghĩa tư bản vẫn là giai đoạn bắt buộc mọi dân tộc phải trải qua", "note": "Xu thế thời đại quá độ lên CNXH.", "d": ["Sự phát triển của cách mạng khoa học - công nghệ và toàn cầu hóa tạo điều kiện tiếp thu thành tựu văn minh nhân loại", "Chủ nghĩa tư bản đã bộc lộ mâu thuẫn nội tại, chủ nghĩa xã hội là xu thế tất yếu của thời đại", "Đó là sự lựa chọn lịch sử của nhân dân Việt Nam dưới sự lãnh đạo của Đảng"]}, {"n": 118, "p": 3, "q": "Chọn phương án sai khi luận giải về: Tiền đề chủ quan của quá độ lên CNXH bỏ qua chế độ TBCN ở Việt Nam:", "a": "Đảng Cộng sản không giữ vai trò lãnh đạo, quá trình quá độ chủ yếu dựa vào cơ chế thị trường tự phát", "note": "Vai trò lãnh đạo của Đảng.", "d": ["Đảng Cộng sản Việt Nam có đường lối đúng đắn, bản lĩnh chính trị và năng lực lãnh đạo", "Sức mạnh đại đoàn kết toàn dân tộc", "Nhà nước pháp quyền xã hội chủ nghĩa của nhân dân, do nhân dân, vì nhân dân"]}, {"n": 119, "p": 3, "q": "Chọn phương án đúng khi đánh giá: Thách thức của Việt Nam thực hiện quá độ lên CNXH bỏ qua chế độ TBCN trong kỷ nguyên mới:", "a": "Xuất phát điểm thấp, trình độ lực lượng sản xuất chưa cao, nguy cơ tụt hậu kinh tế và sự chống phá của các thế lực thù địch", "note": "Thách thức từ thực tiễn.", "d": ["Cơ sở vật chất - kỹ thuật đã hiện đại, nhưng thiếu sự lãnh đạo của Đảng", "Chỉ có thách thức từ bên ngoài, còn bên trong đã ổn định hoàn toàn", "Tài nguyên thiên nhiên cạn kiệt hoàn toàn và không còn nguồn nhân lực"]}, {"n": 120, "p": 3, "q": "Đảng ta xác định bao nhiêu mối quan hệ lớn cần tiếp tục nắm vững và xử lý tốt trong quá trình xây dựng CNXH Việt Nam?", "a": "10 mối quan hệ lớn", "note": "10 mối quan hệ lớn của Đảng.", "d": ["Quy luật giá trị", "Thời gian lao động xã hội cần thiết", "Cường độ lao động"]}, {"n": 121, "p": 3, "q": "Những thời cơ, cơ hội để Việt Nam phát triển bứt phá trong TKQĐ lên CNXH trong kỷ nguyên mới:", "a": "Tác động của Cách mạng công nghiệp lần thứ tư, hội nhập quốc tế sâu rộng và thế và lực của đất nước sau gần 40 năm đổi mới", "note": "Thời cơ vươn mình của đất nước.", "d": ["Sự suy yếu của hội nhập quốc tế và xu hướng bảo hộ thương mại toàn cầu", "Việc hoàn thành công nghiệp hóa, hiện đại hóa và xóa bỏ khoảng cách phát triển", "Sự chấm dứt cạnh tranh giữa các nước lớn trên thế giới"]}, {"n": 122, "p": 3, "q": "Theo quan điểm của C.Mác và Ph.Ăngghen, nhận định nào đúng nhất về nguyên nhân chủ nghĩa tư bản tất yếu được thay thế bằng một chế độ kinh tế - xã hội tiến bộ hơn?", "a": "Do mâu thuẫn gay gắt giữa lực lượng sản xuất mang tính xã hội hóa cao với quan hệ sản xuất dựa trên chế độ chiếm hữu tư nhân tư bản chủ nghĩa về tư liệu sản xuất", "note": "Mâu thuẫn cơ bản của CNTB.", "d": ["Do chủ nghĩa tư bản không còn khả năng tạo ra giá trị thặng dư", "Do mâu thuẫn giữa giai cấp tư sản và giai cấp địa chủ phong kiến", "Do ý chí chủ quan của giai cấp công nhân, không phụ thuộc vào điều kiện kinh tế"]}, {"n": 123, "p": 3, "q": "Theo V.I.Lênin, yếu tố nào sau đây không phải là điều kiện được nêu để các nước có trình độ phát triển kinh tế lạc hậu có thể quá độ lên chủ nghĩa xã hội không qua giai đoạn phát triển tư bản chủ nghĩa?", "a": "Phải trải qua đầy đủ giai đoạn phát triển tư bản chủ nghĩa để xây dựng cơ sở vật chất - kỹ thuật", "note": "Lý luận Lênin.", "d": ["Có sự giúp đỡ của giai cấp vô sản ở các nước tiên tiến", "Có sự lãnh đạo của Đảng Cộng sản", "Có chính quyền nhà nước của giai cấp công nhân và nhân dân lao động"]}, {"n": 124, "p": 3, "q": "Theo sự phát triển nhận thức của Đảng Cộng sản Việt Nam, nội hàm của việc “bỏ qua chế độ tư bản chủ nghĩa” được hiểu đúng nhất là:", "a": "Bỏ qua việc xác lập vị trí thống trị của quan hệ sản xuất và kiến trúc thượng tầng tư bản chủ nghĩa, nhưng tiếp thu, kế thừa những thành tựu mà nhân loại đạt được dưới chủ nghĩa tư bản", "note": "Quan điểm cốt lõi về \"bỏ qua TBCN\".", "d": ["Nền sản xuất dựa trên chế độ chiếm hữu tư nhân tư bản chủ nghĩa về tư liệu sản xuất và bóc lột lao động làm thuê", "Là một phần giá trị thặng dư do công nhân sản xuất ra trong lĩnh vực sản xuất, được nhà tư bản công nghiệp nhường lại thông qua chênh lệch giá bán buôn và giá bán lẻ", "Sự phát triển của lực lượng sản xuất và cạnh tranh tự do làm xuất hiện tập trung sản xuất đến một trình độ nhất định"]}, {"n": 125, "p": 3, "q": "Chọn câu trả lời sai về: Thành phần kinh tế V.I.Lênin đã chỉ ra trong thời kỳ quá độ lên chủ nghĩa xã hội ở nước Nga:", "a": "Kinh tế phong kiến địa chủ chiếm hữu ruộng đất quy mô lớn", "note": "5 thành phần kinh tế thời NEP.", "d": ["Kinh tế gia trưởng (sản xuất tự cấp tự túc)", "Kinh tế tiểu sản xuất hàng hóa", "Kinh tế tư bản nhà nước"]}, {"n": 126, "p": 3, "q": "Hồ Chí Minh đã chỉ ra những hình thức sở hữu chính trong nền kinh tế Việt Nam ở miền Bắc sau năm 1954, ngoại trừ hình thức nào:", "a": "Sở hữu tư bản độc quyền tư nhân (hoặc tư bản nước ngoài 100%)", "note": "Miền Bắc xây dựng kinh tế XHCN.", "d": ["Nguồn gốc thực sự của giá trị thặng dư (chỉ có v mới tạo ra m)", "Phản ánh quy mô bóc lột (Thực tế m' chỉ phản ánh trình độ hoặc mức độ bóc lột)", "Cho rằng tư bản bất biến (c) cũng có khả năng tạo ra giá trị thặng dư"]}, {"n": 127, "p": 3, "q": "Lựa chọn phương án đúng: Tại Đại hội lần thứ VIII (1996) thành phần kinh tế nhà nước được thay cho tên gọi thành phần kinh tế nào:", "a": "Thành phần kinh tế quốc doanh", "note": "Đổi mới tên gọi kinh tế nhà nước.", "d": ["Thành phần kinh tế tập thể", "Thành phần kinh tế tư bản nhà nước", "Thành phần kinh tế hợp tác xã"]}, {"n": 128, "p": 3, "q": "Lựa chọn phương án đúng: Thành phần kinh tế có vốn đầu tư nước ngoài được Đại hội Đảng lần thứ mấy thừa nhận?", "a": "Đại hội lần thứ IX (năm 2001)", "note": "Dấu mốc Đại hội IX.", "d": ["Đại hội lần thứ VIII (năm 1996)", "Đại hội lần thứ X (năm 2006)", "Đại hội lần thứ XI (năm 2011)"]}, {"n": 129, "p": 3, "q": "Kinh tế cá thể, tiểu chủ và kinh tế tư bản tư nhân được thống nhất là thành phần kinh tế tư nhân (cá thể, tiểu chủ, tư bản tư nhân) tại?", "a": "Đại hội lần thứ X (năm 2006)", "note": "Khẳng định tại Đại hội X.", "d": ["Đại hội lần thứ VIII (năm 1996)", "Đại hội lần thứ IX (năm 2001)", "Đại hội lần thứ XI (năm 2011)"]}, {"n": 130, "p": 3, "q": "Từ Đại hội Đảng lần thứ mấy? Đảng ta không nêu chủ trương phát triển thành phần kinh tế tư bản nhà nước:", "a": "Đại hội lần thứ XII (năm 2016)", "note": "Cập nhật tên gọi từ Đại hội XII.", "d": ["Đại hội lần thứ IX (năm 2001)", "Đại hội lần thứ X (năm 2006)", "Đại hội lần thứ XI (năm 2011)"]}, {"n": 131, "p": 3, "q": "Tính tất yếu khách quan của nền kinh tế nhiều thành phần:", "a": "Do sự phát triển không đều của lực lượng sản xuất và sự tồn tại nhiều hình thức sở hữu tư liệu sản xuất khác nhau trong thời kỳ quá độ", "note": "Cơ sở khách quan kinh tế nhiều thành phần.", "d": ["Do ý chí chủ quan của Nhà nước muốn duy trì nhiều hình thức sở hữu", "Do Việt Nam chưa có đủ vốn nên phải dựa hoàn toàn vào thành phần kinh tế tư nhân", "Do lực lượng sản xuất đã phát triển đồng đều và hiện đại ở mọi vùng, mọi ngành"]}, {"n": 132, "p": 3, "q": "Chọn phương án đúng nhất khi nói về: Các hình thức phân phối trong TKQĐ lên CNXH ở Việt Nam:", "a": "Phân phối theo lao động là chủ đạo, bên cạnh đó phân phối theo hiệu quả kinh tế, theo vốn, tài sản và qua các quỹ phúc lợi xã hội", "note": "Đa dạng hóa phân phối.", "d": ["Phân phối theo vốn và tài sản là chủ đạo, phân phối theo lao động chỉ là bổ sung", "Chỉ thực hiện phân phối theo lao động, loại bỏ mọi hình thức phân phối khác", "Phân phối bình quân cho mọi thành viên trong xã hội, không căn cứ vào lao động hay hiệu quả"]}, {"n": 133, "p": 3, "q": "Đại hội XIII đặt ra vấn đề hoàn thiện quan hệ phân phối:", "a": "Phân phối công bằng, hài hòa lợi ích, tạo động lực thúc đẩy tăng trưởng kinh tế gắn với tiến bộ và công bằng xã hội", "note": "Định hướng từ Đại hội XIII.", "d": ["Phân phối bình quân tuyệt đối để xóa bỏ mọi chênh lệch thu nhập", "Ưu tiên tăng trưởng kinh tế, chưa cần gắn với tiến bộ và công bằng xã hội", "Chỉ phân phối theo vốn và tài sản, hạn chế phân phối qua các quỹ phúc lợi xã hội"]}, {"n": 134, "p": 3, "q": "Lựa chọn phương án sai: Ba cuộc cách mạng tiến hành đồng thời do Đại hội III (1960) của Đảng xác định gồm:", "a": "(Đáp án sai hay gặp: Cách mạng giải phóng dân tộc; 3 cuộc cách mạng đúng là: Cách mạng quan hệ sản xuất, Cách mạng khoa học - kỹ thuật, Cách mạng tư tưởng và văn hóa)", "note": "3 cuộc cách mạng Đại hội III.", "d": ["Đều là sự hao phí sức lao động nói chung của con người (về cơ bắp, thần kinh) không kể hình thức cụ thể, và chúng đồng chất với nhau (tạo ra giá trị)", "Là giai đoạn phát triển cao của phương thức sản xuất tư bản chủ nghĩa (chuyển từ tự do cạnh tranh sang độc quyền từ cuối XIX - đầu XX)", "Phải tìm cách hạ thấp hao phí lao động cá biệt nhỏ hơn hoặc bằng thời gian lao động xã hội cần thiết (Hao phí cá biệt ≤ Hao phí xã hội cần thiết)"]}, {"n": 135, "p": 3, "q": "Lựa chọn phương án đúng: Quan điểm của Đảng về mục tiêu về phát triển lực lượng sản xuất là: \"Xây dựng nước ta thành một nước công nghiệp có cơ sở vật chất - kỹ thuật hiện đại, cơ cấu kinh tế hợp lý\" tại Đại hội Đảng lần thứ mấy?", "a": "Đại hội Đảng lần thứ VIII (1996)", "note": "Mục tiêu công nghiệp hóa tại ĐH VIII.", "d": ["Đại hội đại biểu toàn quốc lần thứ VII (1991)", "Đại hội đại biểu toàn quốc lần thứ IX (2001)", "Đại hội đại biểu toàn quốc lần thứ X (2006)"]}, {"n": 136, "p": 3, "q": "Lựa chọn phương án đúng: Quan điểm của Đảng xác định khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số là \"động lực trung tâm\" của tăng trưởng được Đảng ta nêu ra trong Văn kiện Đại hội đại biểu toàn quốc lần thứ mấy?", "a": "Đại hội đại biểu toàn quốc lần thứ XIII (2021)", "note": "Động lực trung tâm từ Đại hội XIII.", "d": ["Đại hội đại biểu toàn quốc lần thứ X (2006)", "Đại hội đại biểu toàn quốc lần thứ XI (2011)", "Đại hội đại biểu toàn quốc lần thứ XII (2016)"]}, {"n": 137, "p": 3, "q": "Lựa chọn phương án đúng: Các nội dung: Chính sách kinh tế mới; Bàn về thuế lương thực; NEP của V.I.Lênin là tên gọi trong?:", "a": "Thời kỳ quá độ lên chủ nghĩa xã hội ở nước Nga (thập niên 1920)", "note": "Chính sách kinh tế mới (NEP).", "d": ["Thời kỳ xây dựng chủ nghĩa tư bản nhà nước ở nước Đức (đầu thế kỷ XX)", "Thời kỳ Công xã Pari (1871)", "Thời kỳ cải cách kinh tế ở Trung Quốc (cuối thập niên 1970)"]}, {"n": 138, "p": 3, "q": "Lựa chọn phương án đúng: Theo Lênin, các biện pháp chủ yếu để phát triển kinh tế đối ngoại phục vụ quá độ lên chủ nghĩa xã hội bao gồm:", "a": "Thu hút vốn đầu tư nước ngoài, nhượng tô, đẩy mạnh ngoại thương, học tập kinh nghiệm quản lý tiên tiến", "note": "Tư tưởng kinh tế đối ngoại của Lênin.", "d": ["Đóng cửa nền kinh tế, hạn chế ngoại thương để tự cung tự cấp", "Quốc hữu hóa toàn bộ tư bản nước ngoài, chỉ trao đổi hàng hóa với các nước xã hội chủ nghĩa", "Chỉ vay viện trợ không hoàn lại, không nhượng tô hay thu hút đầu tư nước ngoài"]}, {"n": 139, "p": 3, "q": "Lựa chọn phương án sai về: Quan điểm của Hồ Chí Minh về kinh tế đối ngoại sau cách mạng tháng 8 năm 1945:", "a": "Hồ Chí Minh chủ trương đóng cửa, không quan hệ kinh tế với nước ngoài để giữ vững độc lập", "note": "Tư tưởng ngoại giao Hồ Chí Minh.", "d": ["Sẵn sàng đặt quan hệ ngoại giao hữu nghị với tất cả các nước dân chủ", "Chủ trương mở cửa, hợp tác kinh tế với nước ngoài trên cơ sở bình đẳng, cùng có lợi", "Hoan nghênh và kêu gọi vốn đầu tư nước ngoài vào xây dựng đất nước"]}, {"n": 140, "p": 3, "q": "Chọn phương án đúng về mốc thời gian: Việt Nam trở thành thành viên chính thức của Tổ chức Thương mại thế giới (WTO) vào năm nào:", "a": "Năm 2007 (ngày 11/01/2007)", "note": "Mốc gia nhập WTO.", "d": ["Giá trị thặng dư (m)", "Tiền lương (Tiền công của công nhân)", "T-H-T' (với T'=T+m)"]}, {"n": 141, "p": 3, "q": "Chọn phương án đúng về mốc thời gian: Hoa Kỳ và Việt Nam bình thường hóa quan hệ ngoại giao vào năm nào:", "a": "Năm 1995 (ngày 12/07/1995)", "note": "Mốc bình thường hóa quan hệ.", "d": ["Năm 1991", "Năm 1994", "Năm 2000"]}, {"n": 142, "p": 3, "q": "Lựa chọn phương án đúng: Quan điểm tiếp tục hoàn thiện thể chế: “Hoàn thiện đồng bộ thể chế phát triển phù hợp với nền kinh tế thị trường đầy đủ, hiện đại... được Đảng ta nêu ra trong Văn kiện Đại hội đại biểu toàn quốc lần thứ mấy?", "a": "Đại hội đại biểu toàn quốc lần thứ XII và XIII", "note": "Hoàn thiện thể chế kinh tế thị trường.", "d": ["Đại hội đại biểu toàn quốc lần thứ IX và X", "Đại hội đại biểu toàn quốc lần thứ X và XI", "Đại hội đại biểu toàn quốc lần thứ XI và XIII"]}, {"n": 143, "p": 3, "q": "Lựa chọn phương án đúng: Quan điểm về phát huy nhân tố con người đã khẳng định: “Phát huy nhân tố con người trong mọi lĩnh vực của đời sống xã hội... được Đảng ta nêu ra trong Văn kiện Đại hội đại biểu toàn quốc lần thứ mấy?", "a": "Đại hội đại biểu toàn quốc lần thứ XIII (2021)", "note": "Con người là trung tâm phát triển.", "d": ["Đại hội đại biểu toàn quốc lần thứ X (2006)", "Đại hội đại biểu toàn quốc lần thứ XI (2011)", "Đại hội đại biểu toàn quốc lần thứ XII (2016)"]},
